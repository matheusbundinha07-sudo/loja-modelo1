<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Painel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#f3f3f0;--ink:#111;--mut:#7b7b76;--line:#e4e4e0;--pap:#f2f2ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
a{color:inherit}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #d6d6d1;border-radius:8px;background:#fff;color:var(--ink)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
label{display:block;margin:0 0 6px;color:var(--mut);font-size:.8rem;font-weight:600}
.pri{background:#111;color:#fff;border:1px solid #111;border-radius:8px;padding:10px 16px;font-weight:600}
.sec{background:#fff;color:#111;border:1px solid #d6d6d1;border-radius:8px;padding:10px 16px}
button:disabled{opacity:.6}
.shell{display:grid;grid-template-columns:224px 1fr;height:100vh}
.side{display:flex;flex-direction:column;gap:4px;padding:14px 12px;background:#fff;border-right:1px solid var(--line);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-weight:700}
.brand img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--pap)}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .nv{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:8px;background:none;color:var(--mut);text-align:left;font-weight:500;text-decoration:none;position:relative}
.side .nv svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .nv:hover{background:#f6f6f3;color:var(--ink)}
.side .nv.on{background:#f0f0ec;color:var(--ink);font-weight:600}
.side .nv.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ink)}
.side .nv em{margin-left:auto;font-style:normal;font-size:.72rem;background:var(--pap);color:var(--ink);border-radius:10px;padding:1px 8px}
.side .gap{flex:1}
.main{overflow:auto;min-width:0}
.app{display:grid;grid-template-columns:300px 400px 1fr;height:100%}
.col{overflow:auto;background:#fff;border-right:1px solid var(--line)}
.lh h2{margin:0;font-size:1rem}
.lh{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dica{padding:14px;color:var(--mut);margin:0}
.it{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.it.on{background:#f0f0ec}
.it img,.th{width:40px;height:50px;object-fit:cover;border-radius:4px;background:var(--pap);flex:none}
.inf{flex:1;min-width:0}.inf b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inf span{color:var(--mut);font-size:.8rem}
.star{border:0;background:none;font-size:1.4rem;color:#c9c9c5;padding:4px}.star.on,.tag{color:#e0a800}
.edhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.x{border:0;background:none;font-size:1.6rem;line-height:1;color:var(--mut)}
.fld{padding:0 18px;margin-top:16px}
.vazio2{padding:32px 24px;color:var(--mut)}
.fotobox{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.fotobox img,.fotobox .th{width:64px;height:80px}.fotobox span{font-size:.8rem;color:var(--mut)}.fotobox .sec{padding:4px 10px;font-size:.8rem;margin-top:6px}
.fgrid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.fi{position:relative;width:76px}
.fi img{width:76px;height:95px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--pap);display:block}
.fi .cv{position:absolute;top:4px;left:4px;font-style:normal;font-size:.65rem;font-weight:700;background:#111;color:#fff;border-radius:4px;padding:1px 6px}
.fi .fb{display:flex;gap:2px;margin-top:4px}
.fi .fb button{flex:1;padding:3px 0;font-size:.7rem;border:1px solid #d6d6d1;border-radius:5px;background:#fff;line-height:1.2}
.fi .fb button:disabled{opacity:.35;cursor:default}
.fdica{font-size:.78rem;color:var(--mut);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative;margin:0;color:var(--ink);cursor:pointer}
.chips input{position:absolute;opacity:0;width:0;height:0}
.chips span{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:40px;padding:0 12px;border:1px solid #d6d6d1;border-radius:8px;background:#fff}
.chips input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
#varbox{margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.9rem;font-weight:400;margin:8px 0}.chk input{width:auto}
.barra{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;align-items:center;margin-top:20px}
.msg{font-size:.85rem;color:#1b7f3b}.msg.err,.err{color:#b3261e}
.prevcol{overflow:auto;background:var(--bg);padding:24px;display:flex;justify-content:center;align-items:flex-start}
.tel{width:100%;max-width:340px;background:#fff;border-radius:22px;border:1px solid var(--line);overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.tel-top{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}.tel-top img{width:28px;height:28px;border-radius:50%}
.big{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--pap)}
.ph{background:var(--pap) url(logo.png) center/40% no-repeat}
.pad{padding:14px}.rot{color:var(--mut);font-size:.78rem;margin:0 0 8px}
.pad h3{margin:0;font-size:1.05rem}.pr{margin:2px 0 8px}.ds{color:var(--mut);margin:0 0 10px;font-size:.85rem}
.sz{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.sz span{border:1px solid #d6d6d1;border-radius:6px;padding:4px 10px;font-size:.8rem}
.zapb{background:#111;color:#fff;text-align:center;padding:12px;border-radius:8px;font-weight:600;font-size:.9rem}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pc{display:flex;flex-direction:column;gap:2px;font-size:.8rem}
.pc img,.pc .ph{width:100%;aspect-ratio:4/5;object-fit:cover;background-color:var(--pap)}.pc span{color:var(--mut)}
.vend{padding:28px 32px 40px;max-width:1000px}
.vend h1{margin:0 0 4px;font-size:1.5rem}.vend .sub{margin:0 0 20px;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi small{color:var(--mut);font-weight:600;font-size:.78rem}.kpi b{display:block;font-size:1.5rem;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.box h2{margin:0;padding:14px 18px;font-size:1rem;border-bottom:1px solid var(--line)}
.box h2 small{color:var(--mut);font-weight:400;margin-left:6px}
.rk{display:grid;grid-template-columns:22px 40px minmax(0,1fr);gap:12px;align-items:center;padding:10px 18px}
.rk+.rk{border-top:1px solid var(--line)}
.rk .n{color:var(--mut);font-weight:700;text-align:center}
.rk .l{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px}.rk .l b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rk .l span{font-weight:700;white-space:nowrap}
.mg{padding:8px 18px 14px}
.mrow{padding:10px 0}
.mrow+.mrow{border-top:1px solid var(--line)}
.ml{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
.ml b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn{color:var(--mut);font-weight:700;min-width:24px}
.mq{font-weight:700;white-space:nowrap;font-size:.9rem}
.mrow:first-child .bar i{background:#e0a800}
.bar{height:10px;background:var(--pap);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#111;border-radius:5px}
.rk:first-of-type .bar i{background:#e0a800}
.vazio3{padding:28px 18px;color:var(--mut);margin:0}
.vr{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line)}
.vr:first-of-type{border-top:0}
.vr .inf{flex:1}
.step{display:flex;gap:4px;align-items:center}
.step button{width:34px;height:34px;border:1px solid #d6d6d1;border-radius:8px;background:#fff;font-size:1.1rem;line-height:1}
.step input{width:60px;text-align:center;padding:7px 4px}
.vr .star{font-size:1.5rem}
.vr .lb{font-size:.7rem;color:var(--mut);text-align:center;width:48px;line-height:1.1}
.warn{background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:.88rem}
.warn code{display:block;margin:8px 0;padding:8px 10px;background:#fff;border:1px solid #ecdca0;border-radius:6px;overflow:auto;white-space:nowrap}
.login{max-width:360px;margin:12vh auto;padding:24px;background:#fff;border:1px solid var(--line);border-radius:12px}
.login h1{font-size:1.3rem;margin:0 0 14px}.login label{margin-top:12px}.login .pri{width:100%;margin-top:16px}
@media(max-width:1100px){.shell{grid-template-columns:64px 1fr}.brand span,.side .nv span,.side .nv em{display:none}.side .nv{justify-content:center;padding:12px 0}.brand{justify-content:center;padding-left:0;padding-right:0}.side .nv.on:before{left:-12px}}
@media(max-width:1000px){.app{display:block;height:auto}.col{overflow:visible;border-right:0}.app.edit .lista{display:none}.app:not(.edit) .editor,.app:not(.edit) .prevcol{display:none}.prevcol{padding:16px}}
@media(max-width:760px){.shell{display:block;height:auto}.side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:5;flex-direction:row;justify-content:space-around;padding:4px 8px;border-right:0;border-top:1px solid var(--line)}.brand,.side .gap{display:none}.side .nv{flex-direction:column;gap:2px;padding:6px 4px;font-size:.68rem}.side .nv span{display:block}.side .nv em{display:none}.side .nv.on:before{display:none}.main{overflow:visible;padding-bottom:64px}.vend{padding:20px 16px 40px}.cards{grid-template-columns:1fr}.vr{flex-wrap:wrap}.vr .inf{flex:1 1 60%}}

.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.seg button{padding:8px 14px;border:1px solid #d6d6d1;border-radius:20px;background:#fff;color:var(--mut)}
.seg button.on{background:#111;color:#fff;border-color:#111}
.cards.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi.g b{color:#1b7f3b}
.pd{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-top:1px solid var(--line)}
.pd:first-of-type{border-top:0}
.pd .pi{flex:1;min-width:0}
.pd .pi b{font-weight:600}.pd .pi .meta{color:var(--mut);font-size:.82rem;margin-top:2px}
.pd ul{margin:8px 0 0;padding-left:18px;color:var(--ink);font-size:.86rem}
.pd .st{display:flex;gap:8px;align-items:center;flex:none}
.bt-ok,.bt-no{width:46px;height:46px;border-radius:10px;font-size:1.3rem;line-height:1;background:#fff;border:1px solid #d6d6d1}
.bt-ok:hover{background:#e6f6ea;border-color:#1b7f3b}.bt-no:hover{background:#fdeceb;border-color:#b3261e}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.c{background:#e6f6ea;color:#1b7f3b}.pill.x{background:#fdeceb;color:#b3261e}.pill.p{background:#fff8e1;color:#8a6500}
.pd .st .sec{padding:6px 10px;font-size:.8rem}
.leg{display:flex;gap:16px;flex-wrap:wrap;padding:10px 18px 16px;font-size:.82rem;color:var(--mut)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.gbox{padding:16px 18px 6px}
.cinp{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:.8rem}.cinp input{width:110px}
@media(max-width:760px){.cards.c4{grid-template-columns:1fr 1fr}.pd{flex-wrap:wrap}.pd .st{width:100%}}

.loja{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start;margin-bottom:18px}
.loja .box{margin-bottom:0}
.lp{display:flex;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.lp>img,.lp>.th{width:48px;height:60px;object-fit:cover;border-radius:8px;background:var(--pap);flex:none}
.lp .inf{flex:1;min-width:0}
.lp .inf b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp .inf span{display:block;color:var(--mut);font-size:.85rem}
.lp.sel{background:#fafaf8}
.ltam{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.ltam button{min-width:38px;height:32px;padding:0 10px;border:1px solid #d6d6d1;border-radius:8px;background:#fff;font-size:.85rem}
.ltam button:hover{border-color:#111}
.ltam button.on{background:#111;color:#fff;border-color:#111}
.ltam .add{margin-left:auto;background:#1b7f3b;color:#fff;border-color:#1b7f3b;font-weight:600;padding:0 14px}
.ltam .add:hover{background:#166b32;border-color:#166b32}
#lcart{position:sticky;top:12px}
#lcart .vr{padding:14px 18px}
#lcart .vr .inf b{display:block}
#lcart .vr .inf span{color:var(--mut);font-size:.85rem}
#lcart .step button{border-radius:50%}
.ltot{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:1.1rem}.ltot b{font-size:1.5rem}
.lok{background:#e6f6ea;color:#1b7f3b;padding:10px 18px;font-weight:600;border-bottom:1px solid var(--line)}
.lbusca{padding:12px 18px}
@media(max-width:900px){.loja{grid-template-columns:1fr}}
@media(max-width:760px){.side .nv{flex:1 0 64px}}
</style></head>
<body><div id="root"></div>
<script>
var db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),root=document.getElementById("root");
// OPÇÕES DO FORMULÁRIO: para incluir categoria, variedade ou tamanho, acrescente nas listas
var CATEGORIAS=["Camisetas","Bonés","Bermudas","Moletons","Calças","Jaquetas","Camisas","Blusas","Vestidos","Saias","Acessórios"];
var TAMANHOS=["PP","P","M","G","GG","XG","Único","36","38","40","42","44","46"];
var VARIEDADES={"Camisetas":["Malhas Peruanas","Times","Oversized"]};
var itens=[],aba="produtos",sel=null,busca="",d={},urlNova=null,aviso="";
var pedidos=[],custos={},semPed=false,fPed="pendente",per="30";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>isNaN(v)?"R$ 0,00":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num=s=>parseFloat(String(s).replace(",","."));
const tams=s=>String(s||"").split(",").map(t=>t.trim()).filter(Boolean);

function login(msg){
 root.innerHTML=`<div class="login"><h1>Entrar no painel</h1><label>E-mail</label><input id="em" type="email"><label>Senha</label><input id="se" type="password"><button class="pri" id="go">Entrar</button><p class="err">${msg||""}</p></div>`;
 $("se").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
 $("go").onclick=async()=>{const r=await db.auth.signInWithPassword({email:$("em").value.trim(),password:$("se").value});if(r.error)root.querySelector(".err").textContent="E-mail ou senha incorretos.";else carregar()};
}
async function carregar(){const r=await db.from("produtos").select("*").order("criado",{ascending:false});if(r.error){login("Sessão expirada. Entre de novo.");return}itens=r.data;await carregaPed();base()}
async function carregaPed(){
 const a=await db.from("pedidos").select("*").order("criado",{ascending:false}).limit(2000);
 const c=await db.from("custos").select("*");
 semPed=!!(a.error||c.error);pedidos=a.error?[]:a.data;custos={};
 if(!c.error)c.data.forEach(x=>custos[x.produto_id]=Number(x.custo));
}
const IC={
 pdv:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="6" rx="1"/><path d="M6 9l-2 11h16L18 9M9 13h6M9 16.5h6"/></svg>',
 ped:'<svg viewBox="0 0 24 24"><path d="M9 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>',
 luc:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>',
 prod:'<svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>',
 vend:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 loja:'<svg viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16M9 20v-6h6v6"/></svg>',
 sair:'<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>'};
function nav(a,ic,txt,n){return `<button class="nv${aba===a?" on":""}" data-a="${a}" title="${txt}"${aba===a?' aria-current="page"':""}>${IC[ic]}<span>${txt}</span>${n!=null?`<em>${n}</em>`:""}</button>`}
function base(){
 const nv=itens.filter(p=>p.mais_vendido).length,pend=pedidos.filter(o=>o.status==="pendente").length;
 const corpo=aba==="produtos"?`<div class="app${sel!==null?" edit":""}" id="app"><div class="col lista" id="lista"></div><div class="col editor" id="editor"></div><div class="prevcol" id="prevcol"></div></div>`:`<div class="vend" id="vend"></div>`;
 root.innerHTML=`<div class="shell"><aside class="side" aria-label="Menu"><div class="brand"><img src="logo.png" alt=""><span>${esc(LOJA)}</span></div>${nav("produtos","prod","Produtos",itens.length)}${nav("caixa","pdv","Caixa",null)}${nav("pedidos","ped","Vendas",pend)}${nav("lucro","luc","Lucro",null)}${nav("vendidos","vend","Mais vendidos",nv)}<div class="gap"></div><a class="nv" href="/" target="_blank" title="Ver loja">${IC.loja}<span>Ver loja</span></a><button class="nv" id="sair" title="Sair">${IC.sair}<span>Sair</span></button></aside><main class="main" id="main">${corpo}</main></div>`;
 $("sair").onclick=async()=>{await db.auth.signOut();sel=null;login()};
 root.querySelectorAll(".side [data-a]").forEach(b=>b.onclick=()=>{if(aba===b.dataset.a)return;aba=b.dataset.a;sel=null;base()});
 if(aba==="produtos"){lista();editor();prev()}else if(aba==="caixa")lojaUI();else if(aba==="pedidos")pedidosUI();else if(aba==="lucro")lucroUI();else vendidos();
}
function lista(){
 $("lista").innerHTML=`<div class="lh"><h2>Produtos (${itens.length})</h2><input id="busca" placeholder="Buscar produto" value="${esc(busca)}"><button class="pri" id="novo">+ Novo produto</button></div><div id="rows"></div>`;
 $("busca").oninput=e=>{busca=e.target.value;rows()};
 $("novo").onclick=()=>abrir("novo");
 rows();
}
function thumb(p){return p.foto_url?`<img src="${esc(p.foto_url)}" alt="">`:`<div class="th"></div>`}
function rows(){
 const q=busca.toLowerCase(),l=itens.filter(p=>p.nome.toLowerCase().includes(q));
 $("rows").innerHTML=l.map(p=>`<div class="it${p.id===sel?" on":""}" data-id="${p.id}">${thumb(p)}<div class="inf"><b>${esc(p.nome)}</b><span>${brl(Number(p.preco))}${p.categoria?" · "+esc(p.categoria):""}${p.ativo?"":" · oculto"}</span></div>${p.mais_vendido?`<span class="tag" title="Mais vendido">★</span>`:""}</div>`).join("")||`<p class="dica">Nenhum produto.</p>`;
 $("rows").querySelectorAll(".it").forEach(r=>r.onclick=()=>abrir(r.dataset.id));
}
function abrir(id){
 sel=id;if(d.fotos)d.fotos.forEach(f=>{if(f.file)URL.revokeObjectURL(f.url)})
 const p=id==="novo"?{ativo:true}:itens.find(x=>x.id===id);

async function mudarStatus(o,s){
 const ant=o.status,u={status:s,concluido_em:s==="concluida"?new Date().toISOString():null,custo:s==="concluida"?custoCalc(itensDe(o)):null};

 if(r.error){alert("Erro ao atualizar o pedido. Se persistir, clique em Sair e entre de novo.");return}
 Object.assign(o,u);
 if(ant!==s&&(ant==="concluida"||s==="concluida")){
  const dir=s==="concluida"?1:-1;
  for(const i of itensDe(o)){const p=itens.find(x=>String(x.id)===String(i.id));
   if(p&&"vendas" in p){const n=Math.max(0,V(p)+dir*(Number(i.q)||0));const x=await db.from("produtos").update({vendas:n}).eq("id",p.id);if(!x.error)p.vendas=n}}
 }
 base();
}
function periodoBuckets(){

 else{for(let i=+per-1;i>=0;i--){const x=new Date(h.getFullYear(),h.getMonth(),h.getDate()-i);b.push({k:dk(x),l:pad(x.getDate())+"/"+pad(x.getMonth()+1),rec:0,luc:0})}}

}
function grafico(B){
 const W=700,H=230,pl=6,pt=10,pb=26,ch=H-pt-pb,mx=Math.max(1,...B.map(b=>Math.max(b.rec,b.luc))),bw=(W-pl*2)/B.length,w=Math.max(2,bw*.34),passo=Math.ceil(B.length/10);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Receita e lucro por período" style="width:100%;height:auto;display:block"><line x1="0" x2="${W}" y1="${pt+ch}" y2="${pt+ch}" stroke="#e4e4e0"/>`;
 B.forEach((b,i)=>{
  const x=pl+i*bw+bw*.1,h1=b.rec/mx*ch,h2=Math.max(0,b.luc)/mx*ch;
  s+=`<rect x="${x}" y="${pt+ch-h1}" width="${w}" height="${h1}" rx="2" fill="#111"><title>${b.l} · receita ${brl(b.rec)}</title></rect><rect x="${x+w+2}" y="${pt+ch-h2}" width="${w}" height="${h2}" rx="2" fill="#1b7f3b"><title>${b.l} · lucro ${brl(b.luc)}</title></rect>`;
  if(i%passo===0)s+=`<text x="${x+w}" y="${H-8}" text-anchor="middle" font-size="11" fill="#7b7b76">${b.l}</text>`;
 });
 return s+"</svg>";
}

   const t=selL.t,i=cartL.find(x=>String(x.id)===String(p.id)&&x.t===t);
   if(i)i.q++;else cartL.push({id:p.id,n:p.nome,p:Number(p.preco)||0,t:t,q:1});
   selL=null;flashL="";lProds();lCart()}});
}
function lCart(){
 const tot=cartL.reduce((s,i)=>s+i.p*i.q,0),qt=cartL.reduce((s,i)=>s+i.q,0);
 $("lcart").innerHTML=`<h2>Venda atual<small>${qt} ${qt===1?"peça":"peças"}</small></h2>${flashL?`<div class="lok">${esc(flashL)}</div>`:""}
${cartL.map((i,k)=>`<div class="vr" data-k="${k}"><div class="inf"><b>${esc(i.n)}</b><span>Tam. ${esc(i.t)}</span></div><div class="step"><button type="button" data-d="-1" aria-label="Menos">−</button><span style="min-width:22px;text-align:center">${i.q}</span><button type="button" data-d="1" aria-label="Mais">+</button></div><label class="cinp">R$<input data-pr inputmode="decimal" value="${String(i.p).replace(".",",")}" style="width:84px" aria-label="Preço de ${esc(i.n)}"></label></div>`).join("")||`<p class="vazio3">Toque no tamanho de um produto para adicionar à venda.</p>`}
<div style="padding:14px 18px;border-top:1px solid var(--line)"><label>Forma de pagamento</label><div class="seg">${PAGS.map(x=>`<button type="button" data-pg="${x}" class="${pagL===x?"on":""}">${x}</button>`).join("")}</div><label>Cliente (opcional)</label><input id="lcli" value="${esc(cliL)}" placeholder="Nome do cliente"><div class="ltot"><span>Total</span><b>${brl(tot)}</b></div><button class="pri" id="lfim" style="width:100%"${cartL.length&&!semPed?"":" disabled"}>✅ Finalizar venda</button>${cartL.length?`<button class="sec" id="llimpa" style="width:100%;margin-top:8px">Limpar</button>`:""}</div>`;
 const c=$("lcart");
 c.querySelectorAll(".vr").forEach(r=>{const i=cartL[+r.dataset.k];
  r.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{i.q+=Number(b.dataset.d);if(i.q<1)cartL.splice(+r.dataset.k,1);lCart()});
  r.querySelector("[data-pr]").onchange=e=>{const v=num(e.target.value);if(isNaN(v)||v<0){alert("Digite um preço válido, ex: 89,90");lCart();return}i.p=v;lCart()}});
 c.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{pagL=b.dataset.pg;lCart()});
 $("lcli").oninput=e=>{cliL=e.target.value};
 $("lfim").onclick=fimL;if($("llimpa"))$("llimpa").onclick=()=>{cartL=[];lCart()};
}
async function fimL(){
 if(!cartL.length)return;
 const b=$("lfim");b.disabled=true;b.textContent="Salvando...";
 const its=cartL.map(i=>({id:i.id,n:i.n,p:i.p,t:i.t,q:i.q})),total=its.reduce((s,i)=>s+i.p*i.q,0);
 const row={cliente_nome:cliL.trim()||"Venda na loja",itens:its,total,status:"concluida",concluido_em:new Date().toISOString(),custo:custoCalc(its),origem:"loja",pagamento:pagL};
 const r=await db.from("pedidos").insert(row).select().single();
 if(r.error){console.error(r.error);alert("Erro ao registrar a venda. Confira se rodou o arquivo pedidos_loja.sql no Supabase. Se persistir, clique em Sair e entre de novo.");b.disabled=false;b.textContent="✅ Finalizar venda";return}
 pedidos.unshift(r.data);
 for(const i of its){const p=itens.find(x=>String(x.id)===String(i.id));
  if(p&&"vendas" in p){const n=V(p)+i.q;const x=await db.from("produtos").update({vendas:n}).eq("id",p.id);if(!x.error)p.vendas=n}}
 cartL=[];cliL="";flashL="Venda registrada: "+brl(total)+" ("+pagL+")";
 base();
}
function lHoje(){
 const hj=dk(new Date()),l=pedidos.filter(o=>o.origem==="loja"&&dk(new Date(o.criado))===hj),ok=l.filter(o=>o.status==="concluida");
 $("lht").textContent=ok.length+(ok.length===1?" venda · ":" vendas · ")+brl(ok.reduce((s,o)=>s+(Number(o.total)||0),0));
 $("lpg").innerHTML=PAGS.map(x=>{const t=ok.filter(o=>o.pagamento===x).reduce((s,o)=>s+(Number(o.total)||0),0);return t?`<span>${x}: <b>${brl(t)}</b></span>`:""}).join("")||`<span>Nenhuma venda registrada hoje.</span>`;
 $("lhoje").innerHTML=l.map(o=>`<div class="pd" data-id="${esc(o.id)}"><div class="pi"><b>${new Date(o.criado).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</b> · ${esc(o.cliente_nome)}${o.pagamento?" · "+esc(o.pagamento):""}<div class="meta">${itensDe(o).map(i=>esc(i.q)+"x "+esc(i.n)+" ("+esc(i.t)+")").join(", ")}</div></div><div class="st"><b>${brl(Number(o.total))}</b>${o.status==="concluida"?`<button class="sec" data-x="1">Cancelar</button>`:PILL.cancelada}</div></div>`).join("");
 $("lhoje").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{
  const o=pedidos.find(x=>String(x.id)===b.closest(".pd").dataset.id);
  if(confirm("Cancelar esta venda? Ela sai das vendas, do lucro e do ranking."))mudarStatus(o,"cancelada")});
}
async function salvar(){
 const msg=$("msg"),preco=num(d.preco);
 const erro=!d.nome.trim()||isNaN(preco)?"Preencha o nome e um preço válido.":!d.categoria?"Escolha a categoria.":!d.tamanhos.length?"Marque pelo menos um tamanho.":"";
 if(erro){msg.className="msg err";msg.textContent=erro;return}
 const b=$("salvar");b.disabled=true;b.textContent="Salvando...";
 const falha=t=>{msg.className="msg err";msg.textContent=t;b.disabled=false;b.textContent="Salvar"};
 const urls=[];let k=0;
 for(const f of d.fotos){
  if(f.file){const n=Date.now()+"-"+(k++)+"-"+f.file.name.replace(/[^a-zA-Z0-9.]/g,"_");const u=await db.storage.from("fotos").upload(n,f.file);if(u.error){falha("Erro ao enviar a foto.");return}urls.push(db.storage.from("fotos").getPublicUrl(n).data.publicUrl)}
  else urls.push(f.url);
 }
 const row={nome:d.nome.trim(),preco,categoria:d.categoria,variedade:d.variedade||null,tamanhos:d.tamanhos.join(", "),descricao:d.descricao.trim(),ativo:d.ativo,mais_vendido:d.mais_vendido,foto_url:urls[0]||null,fotos:urls};
 const grava=x=>sel==="novo"?db.from("produtos").insert(x).select().single():db.from("produtos").update(x).eq("id",sel).select().single();
 let r=await grava(row),semCol=false;
 if(r.error&&/fotos/i.test(r.error.message||"")){delete row.fotos;semCol=true;r=await grava(row)}
 if(r.error){console.error(r.error);falha("Erro ao salvar: "+(r.error.message||"desconhecido")+". Se falar em sessão/permissão, clique em Sair e entre de novo.");return}
 const l=await db.from("produtos").select("*").order("criado",{ascending:false});if(!l.error)itens=l.data;
 aviso=semCol&&urls.length>1?"Salvo só com a capa: falta criar a coluna 'fotos' no Supabase.":"Salvo!";lista();abrir(r.data.id);
}
async function excluir(){if(!confirm("Excluir este produto?"))return;const r=await db.from("produtos").delete().eq("id",sel);if(r.error){alert("Erro ao excluir.");return}sel=null;carregar()}
db.auth.getSession().then(r=>r.data.session?carregar():login());
</script></body></html>
