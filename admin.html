<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><title>Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#f5f5f3;--ink:#111;--mut:#777772;--line:#e6e6e3;--pap:#efefec;--sinal:#ffd400;--disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
a{color:inherit}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #d6d6d1;border-radius:8px;background:#fff;color:var(--ink)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
label{display:block;margin:0 0 6px;color:var(--mut);font-size:.8rem;font-weight:600}
.pri{background:#111;color:#fff;border:1px solid #111;border-radius:8px;padding:10px 16px;font-weight:600}
.sec{background:#fff;color:#111;border:1px solid #d6d6d1;border-radius:8px;padding:10px 16px}
button:disabled{opacity:.6}
.shell{display:grid;grid-template-columns:224px 1fr;height:100vh}
.side{display:flex;flex-direction:column;gap:4px;padding:14px 12px;background:#fff;border-right:1px solid var(--line);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-weight:700}
.brand img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--pap)}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .nv{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:8px;background:none;color:var(--mut);text-align:left;font-weight:500;text-decoration:none;position:relative}
.side .nv svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .nv:hover{background:#f6f6f3;color:var(--ink)}
.side .nv.on{background:#f0f0ec;color:var(--ink);font-weight:600}
.side .nv.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ink)}
.side .nv em{margin-left:auto;font-style:normal;font-size:.72rem;background:var(--pap);color:var(--ink);border-radius:10px;padding:1px 8px}
.side .gap{flex:1}
.main{overflow:auto;min-width:0}
.app{display:grid;grid-template-columns:300px 400px 1fr;height:100%}
.col{overflow:auto;background:#fff;border-right:1px solid var(--line)}
.lh h2{margin:0;font-size:1rem}
.lh{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dica{padding:14px;color:var(--mut);margin:0}
.it{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.it.on{background:#f0f0ec}
.it img,.th{width:40px;height:50px;object-fit:cover;border-radius:4px;background:var(--pap);flex:none}
.inf{flex:1;min-width:0}.inf b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inf span{color:var(--mut);font-size:.8rem}
.star{border:0;background:none;font-size:1.4rem;color:#c9c9c5;padding:4px}.star.on,.tag{color:#e0a800}
.edhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.x{border:0;background:none;font-size:1.6rem;line-height:1;color:var(--mut)}
.fld{padding:0 18px;margin-top:16px}
.vazio2{padding:32px 24px;color:var(--mut)}
.fotobox{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.fotobox img,.fotobox .th{width:64px;height:80px}.fotobox span{font-size:.8rem;color:var(--mut)}.fotobox .sec{padding:4px 10px;font-size:.8rem;margin-top:6px}
.fgrid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.fi{position:relative;width:76px}
.fi img{width:76px;height:95px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--pap);display:block}
.fi .cv{position:absolute;top:4px;left:4px;font-style:normal;font-size:.65rem;font-weight:700;background:#111;color:#fff;border-radius:4px;padding:1px 6px}
.fi .fb{display:flex;gap:2px;margin-top:4px}
.fi .fb button{flex:1;padding:3px 0;font-size:.7rem;border:1px solid #d6d6d1;border-radius:5px;background:#fff;line-height:1.2}
.fi .fb button:disabled{opacity:.35;cursor:default}
.fdica{font-size:.78rem;color:var(--mut);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative;margin:0;color:var(--ink);cursor:pointer}
.chips input{position:absolute;opacity:0;width:0;height:0}
.chips span{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:40px;padding:0 12px;border:1px solid #d6d6d1;border-radius:8px;background:#fff}
.chips input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.est{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:6px}
.est-i{display:flex;flex-direction:column;gap:4px;margin:0;color:var(--ink)}
.est-i span{font-weight:600;font-size:.9rem}
.est-i input{width:100%;box-sizing:border-box}
#varbox{margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.9rem;font-weight:400;margin:8px 0}.chk input{width:auto}
.barra{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;align-items:center;margin-top:20px}
.msg{font-size:.85rem;color:#1b7f3b}.msg.err,.err{color:#b3261e}
.prevcol{overflow:auto;background:var(--bg);padding:24px;display:flex;justify-content:center;align-items:flex-start}
.tel{width:100%;max-width:340px;background:#fff;border-radius:22px;border:1px solid var(--line);overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.tel-top{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}.tel-top img{width:28px;height:28px;border-radius:50%}
.big{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--pap)}
.ph{background:var(--pap)}
.pad{padding:14px}.rot{color:var(--mut);font-size:.78rem;margin:0 0 8px}
.pad h3{margin:0;font-size:1.05rem}.pr{margin:2px 0 8px}.ds{color:var(--mut);margin:0 0 10px;font-size:.85rem}
.sz{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.sz span{border:1px solid #d6d6d1;border-radius:6px;padding:4px 10px;font-size:.8rem}
.zapb{background:#111;color:#fff;text-align:center;padding:12px;border-radius:8px;font-weight:600;font-size:.9rem}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pc{display:flex;flex-direction:column;gap:2px;font-size:.8rem}
.pc img,.pc .ph{width:100%;aspect-ratio:4/5;object-fit:cover;background-color:var(--pap)}.pc span{color:var(--mut)}
.vend{padding:28px 32px 40px;max-width:1000px}
.vend h1{margin:0 0 4px;font-size:1.5rem}.vend .sub{margin:0 0 20px;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi small{color:var(--mut);font-weight:600;font-size:.78rem}.kpi b{display:block;font-size:1.5rem;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.box h2{margin:0;padding:14px 18px;font-size:1rem;border-bottom:1px solid var(--line)}
.box h2 small{color:var(--mut);font-weight:400;margin-left:6px}
.rk{display:grid;grid-template-columns:22px 40px minmax(0,1fr);gap:12px;align-items:center;padding:10px 18px}
.rk+.rk{border-top:1px solid var(--line)}
.rk .n{color:var(--mut);font-weight:700;text-align:center}
.rk .l{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px}.rk .l b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rk .l span{font-weight:700;white-space:nowrap}
.mg{padding:8px 18px 14px}
.mrow{padding:10px 0}
.mrow+.mrow{border-top:1px solid var(--line)}
.ml{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.ml b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn{color:var(--mut);font-weight:700;min-width:24px}
.mq{font-weight:700;white-space:nowrap;font-size:.9rem}
.mrow:first-child .bar i{background:#e0a800}
.bar{height:10px;background:var(--pap);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#111;border-radius:5px}
.rk:first-of-type .bar i{background:#e0a800}
.vazio3{padding:28px 18px;color:var(--mut);margin:0}
.vr{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line)}
.vr:first-of-type{border-top:0}
.vr .inf{flex:1}
.step{display:flex;gap:4px;align-items:center}
.step button{width:34px;height:34px;border:1px solid #d6d6d1;border-radius:8px;background:#fff;font-size:1.1rem;line-height:1}
.step input{width:60px;text-align:center;padding:7px 4px}
.vr .star{font-size:1.5rem}
.vr .lb{font-size:.7rem;color:var(--mut);text-align:center;width:48px;line-height:1.1}
.warn{background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:.88rem}
.warn code{display:block;margin:8px 0;padding:8px 10px;background:#fff;border:1px solid #ecdca0;border-radius:6px;overflow:auto;white-space:nowrap}
.login{max-width:360px;margin:12vh auto;padding:24px;background:#fff;border:1px solid var(--line);border-radius:12px}
.login h1{font-size:1.3rem;margin:0 0 14px}.login label{margin-top:12px}.login .pri{width:100%;margin-top:16px}
@media(max-width:1100px){.shell{grid-template-columns:64px 1fr}.brand span,.side .nv span,.side .nv em{display:none}.side .nv{justify-content:center;padding:12px 0}.brand{justify-content:center;padding-left:0;padding-right:0}.side .nv.on:before{left:-12px}}
@media(max-width:1000px){.app{display:block;height:auto}.col{overflow:visible;border-right:0}.app.edit .lista{display:none}.app:not(.edit) .editor,.app:not(.edit) .prevcol{display:none}.prevcol{padding:16px}}
@media(max-width:760px){.shell{display:block;height:auto}.side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:5;flex-direction:row;justify-content:space-around;padding:4px 8px;border-right:0;border-top:1px solid var(--line)}.brand,.side .gap{display:none}.side .nv{flex-direction:column;gap:2px;padding:6px 4px;font-size:.68rem}.side .nv span{display:block}.side .nv em{display:none}.side .nv.on:before{display:none}.main{overflow:visible;padding-bottom:64px}.vend{padding:20px 16px 40px}.cards{grid-template-columns:1fr}.vr{flex-wrap:wrap}.vr .inf{flex:1 1 60%}}

.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.seg button{padding:8px 14px;border:1px solid #d6d6d1;border-radius:20px;background:#fff;color:var(--mut)}
.seg button.on{background:#111;color:#fff;border-color:#111}
.cards.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi.g b{color:#1b7f3b}
.pd{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-top:1px solid var(--line)}
.pd:first-of-type{border-top:0}
.pd .pi{flex:1;min-width:0}
.pd .pi b{font-weight:600}.pd .pi .meta{color:var(--mut);font-size:.82rem;margin-top:2px}
.pd ul{margin:8px 0 0;padding-left:18px;color:var(--ink);font-size:.86rem}
.pd .st{display:flex;gap:8px;align-items:center;flex:none}
.bt-ok,.bt-no{width:46px;height:46px;border-radius:10px;font-size:1.3rem;line-height:1;background:#fff;border:1px solid #d6d6d1}
.bt-ok:hover{background:#e6f6ea;border-color:#1b7f3b}.bt-no:hover{background:#fdeceb;border-color:#b3261e}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.c{background:#e6f6ea;color:#1b7f3b}.pill.x{background:#fdeceb;color:#b3261e}.pill.p{background:#fff8e1;color:#8a6500}
.pd .st .sec{padding:6px 10px;font-size:.8rem}
.leg{display:flex;gap:16px;flex-wrap:wrap;padding:10px 18px 16px;font-size:.82rem;color:var(--mut)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.gbox{padding:16px 18px 6px}
.cinp{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:.8rem}.cinp input{width:110px}
@media(max-width:760px){.cards.c4{grid-template-columns:1fr 1fr}.pd{flex-wrap:wrap}.pd .st{width:100%}}

.cards.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.low{color:#b3261e;font-weight:700}
.cal2{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}.cal2 .box{margin-bottom:18px}
.cd{padding:14px 18px 0;text-align:right}.cd small{color:var(--mut);font-size:.85rem}.cd div{font-size:2rem;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 18px 18px}.kp button{height:48px;border:1px solid #d6d6d1;border-radius:10px;background:#fff;font-size:1.1rem}.kp .o{background:#f0f0ec}.kp .e{background:#111;color:#fff;border-color:#111}.kp [data-k="0"]{grid-column:span 2}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:14px 18px}.cg>b{text-align:center;color:var(--mut);font-size:.75rem}
.dy{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:#fff;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0}.dy small{font-size:.62rem}
.dy.v{background:#2e9e55;border-color:#2e9e55;color:#fff}.dy.r{background:#d64545;border-color:#d64545;color:#fff}.dy.f{color:var(--mut)}.dy.sel{outline:2px solid #111;outline-offset:1px}.dy.h b{text-decoration:underline}
@media(max-width:900px){.cal2{grid-template-columns:1fr}}
.loja{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start;margin-bottom:18px}
.loja .box{margin-bottom:0}
.lp{display:flex;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.lp>img,.lp>.th{width:48px;height:60px;object-fit:cover;border-radius:8px;background:var(--pap);flex:none}
.lp .inf{flex:1;min-width:0}
.lp .inf b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp .inf span{display:block;color:var(--mut);font-size:.85rem}
.lp.sel{background:#fafaf8}
.ltam{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.ltam button{min-width:38px;height:32px;padding:0 10px;border:1px solid #d6d6d1;border-radius:8px;background:#fff;font-size:.85rem}
.ltam button:hover{border-color:#111}
.ltam button.on{background:#111;color:#fff;border-color:#111}
.ltam .add{margin-left:auto;background:#1b7f3b;color:#fff;border-color:#1b7f3b;font-weight:600;padding:0 14px}
.ltam .add:hover{background:#166b32;border-color:#166b32}
#lcart{position:sticky;top:12px}
#lcart .vr{padding:14px 18px}
#lcart .vr .inf b{display:block}
#lcart .vr .inf span{color:var(--mut);font-size:.85rem}
#lcart .step button{border-radius:50%}
.ltot{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:1.1rem}.ltot b{font-size:1.5rem}
.lok{background:#e6f6ea;color:#1b7f3b;padding:10px 18px;font-weight:600;border-bottom:1px solid var(--line)}
.lbusca{padding:12px 18px}
@media(max-width:900px){.loja{grid-template-columns:1fr}}
@media(max-width:760px){.side .nv{flex:1 0 64px}.cards.c5{grid-template-columns:1fr 1fr}}

/* ===== tema rua / clean + animações ===== */
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes crescer{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes barra{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(224,168,0,.6)}100%{box-shadow:0 0 0 7px rgba(224,168,0,0)}}
*{scrollbar-width:thin;scrollbar-color:#c9c9c5 transparent}
body{font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif}
button{transition:background .15s,color .15s,border-color .15s,transform .12s,box-shadow .2s}
button:active:not(:disabled){transform:scale(.97)}
input,select,textarea{border-radius:4px;border-color:#d9d9d5;transition:border-color .15s,box-shadow .15s}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px var(--sinal)}
.pri,.sec{border-radius:4px}
.pri:hover:not(:disabled){background:var(--sinal);border-color:var(--sinal);color:var(--ink)}
.sec:hover:not(:disabled){border-color:var(--ink)}

/* entrada da tela ao trocar de aba */
.main>*{animation:subir .35s ease-out both}
.login{border-radius:6px;border-top:4px solid var(--sinal);animation:subir .45s ease-out both}
.login h1,.vend h1{font:800 clamp(1.9rem,3.6vw,2.7rem)/.95 var(--disp);text-transform:uppercase;letter-spacing:-.005em}
.vend h1{margin:0 0 6px}

/* menu lateral */
.side{background:#fff}
.brand{font:800 1.7rem/1 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.brand:before{content:"";width:12px;height:12px;flex:none;background:var(--sinal);transition:transform .4s}
.brand:hover:before{transform:rotate(90deg)}
.side .nv{border-radius:4px;transition:background .15s,color .15s}
.side .nv svg{transition:transform .2s}
.side .nv:hover svg{transform:scale(1.14)}
.side .nv.on{background:var(--ink);color:#fff}
.side .nv.on svg{stroke:var(--sinal)}
.side .nv.on:before{background:var(--sinal);animation:barra .25s ease-out}
.side .nv em{background:var(--sinal);color:var(--ink);font-weight:700;animation:pop .35s ease-out}

/* títulos */
.box,.kpi{border-radius:6px}
.box h2,.lh h2{font:700 1.2rem/1.1 var(--disp);text-transform:uppercase;letter-spacing:.03em}
.box h2 small{font-family:"Archivo",system-ui,sans-serif;text-transform:none;letter-spacing:0}

/* cartões de números */
.kpi{position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.kpi:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--sinal);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.kpi:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.07)}
.kpi:hover:before{transform:scaleX(1)}
.kpi b{font:800 2rem/1.05 var(--disp);letter-spacing:.01em}

/* listas */
.it,.vr,.pd,.lp{transition:background .15s}
.it{position:relative}
.it:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sinal);transform:scaleY(0);transition:transform .2s}
.it:hover:before,.it.on:before{transform:scaleY(1)}
.it:hover,.vr:hover,.pd:hover,.lp:hover{background:#fafaf8}
.it.on{background:#fff8d1}
.it img,.th{border-radius:3px}

/* barras que crescem */
.bar,.bar i{border-radius:3px}
.bar i{transform-origin:left;animation:crescer .8s cubic-bezier(.2,.8,.2,1) both}
.rk:nth-child(3) .bar i,.mrow:nth-child(2) .bar i{animation-delay:0.07s}
.rk:nth-child(4) .bar i,.mrow:nth-child(3) .bar i{animation-delay:0.14s}
.rk:nth-child(5) .bar i,.mrow:nth-child(4) .bar i{animation-delay:0.21s}
.rk:nth-child(6) .bar i,.mrow:nth-child(5) .bar i{animation-delay:0.28s}
.rk:nth-child(7) .bar i,.mrow:nth-child(6) .bar i{animation-delay:0.35s}
.rk:nth-child(8) .bar i,.mrow:nth-child(7) .bar i{animation-delay:0.42s}
.rk:nth-child(9) .bar i,.mrow:nth-child(8) .bar i{animation-delay:0.49s}

<body><div id="root"></div>
<script>
var db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),root=document.getElementById("root");

var CATEGORIAS=["Camisetas","Bonés","Bermudas","Moletons","Calças","Jaquetas","Camisas","Blusas","Vestidos","Saias","Acessórios"];
var TAMANHOS=["PP","P","M","G","GG","XG","Único","36","38","40","42","44","46"];
var VARIEDADES={"Camisetas":["Malhas Peruanas","Times","Oversized"]};
var itens=[],aba="inicio",sel=null,busca="",d={},urlNova=null,aviso="";
var pedidos=[],custos={},semPed=false,fPed="pendente",per="30",despesas=[],semDesp=false,catF="",descL="",recL="";const LIM=2;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>isNaN(v)?"R$ 0,00":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num=s=>parseFloat(String(s).replace(",","."));
const tams=s=>String(s||"").split(",").map(t=>t.trim()).filter(Boolean);

function login(msg){
 root.innerHTML=`<div class="login"><h1>Entrar no painel</h1><label>E-mail</label><input id="em" type="email"><label>Senha</label><input id="se" type="password"><button class="pri" id="go">Entrar</button><p class="err">${msg||""}</p></div>`;
 $("se").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
 $("go").onclick=async()=>{const r=await db.auth.signInWithPassword({email:$("em").value.trim(),password:$("se").value});if(r.error)root.querySelector(".err").textContent="E-mail ou senha incorretos.";else carregar()};
}
async function carregar(){const r=await db.from("produtos").select("*").order("criado",{ascending:false});if(r.error){login("Sessão expirada. Entre de novo.");return}itens=r.data;await carregaPed();base();aoVivo()}
async function carregaPed(){
 const a=await db.from("pedidos").select("*").order("criado",{ascending:false}).limit(2000);
 const c=await db.from("custos").select("*");
 const e=await db.from("despesas").select("*").order("data",{ascending:false}).limit(500);semDesp=!!e.error;despesas=e.error?[]:e.data;
 semPed=!!(a.error||c.error);pedidos=a.error?[]:a.data;custos={};
 if(!c.error)c.data.forEach(x=>custos[x.produto_id]=Number(x.custo));
}
const IC={
 pdv:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="6" rx="1"/><path d="M6 9l-2 11h16L18 9M9 13h6M9 16.5h6"/></svg>',
 ped:'<svg viewBox="0 0 24 24"><path d="M9 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>',
 luc:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>',
 prod:'<svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>',
 vend:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 loja:'<svg viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16M9 20v-6h6v6"/></svg>',
 ini:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>',
 cli:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.6 4 2.4 4 6"/></svg>',
 promo:'<svg viewBox="0 0 24 24"><path d="M19 5L5 19"/><circle cx="7.5" cy="7.5" r="2"/><circle cx="16.5" cy="16.5" r="2"/></svg>',
 cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 sair:'<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>'};
function nav(a,ic,txt,n){return `<button class="nv${aba===a?" on":""}" data-a="${a}" title="${txt}"${aba===a?' aria-current="page"':""}>${IC[ic]}<span>${txt}</span>${n!=null?`<em>${n}</em>`:""}</button>`}
function base(){
 const nv=itens.filter(p=>p.mais_vendido).length,pend=pedidos.filter(o=>o.status==="pendente").length;
 const corpo=aba==="produtos"?`<div class="app${sel!==null?" edit":""}" id="app"><div class="col lista" id="lista"></div><div class="col editor" id="editor"></div><div class="prevcol" id="prevcol"></div></div>`:`<div class="vend" id="vend"></div>`;
 root.innerHTML=`<div class="shell"><aside class="side" aria-label="Menu"><div class="brand"><span>Sua loja</span></div>${nav("inicio","ini","Início",null)}${nav("produtos","prod","Produtos",itens.length)}${nav("caixa","pdv","Caixa",null)}${nav("pedidos","ped","Vendas",pend)}${nav("lucro","luc","Lucro",null)}${nav("vendidos","vend","Mais vendidos",nv)}${nav("clientes","cli","Clientes",null)}${nav("promo","promo","Promoções",null)}${nav("calendario","cal","Calendário",null)}<div class="gap"></div><a class="nv" href="/" target="_blank" title="Ver loja">${IC.loja}<span>Ver loja</span></a><button class="nv" id="sair" title="Sair">${IC.sair}<span>Sair</span></button></aside><main class="main" id="main">${corpo}</main></div>`;
 $("sair").onclick=async()=>{await db.auth.signOut();sel=null;login()};
 root.querySelectorAll(".side [data-a]").forEach(b=>b.onclick=()=>{if(aba===b.dataset.a)return;aba=b.dataset.a;sel=null;base()});
 if(aba==="produtos"){lista();editor();prev()}else if(aba==="inicio")inicioUI();else if(aba==="promo")promoUI();else if(aba==="calendario")calUI();else if(aba==="clientes")clientesUI();else if(aba==="caixa")lojaUI();else if(aba==="pedidos")pedidosUI();else if(aba==="lucro")lucroUI();else vendidos();
}
function lista(){
 $("lista").innerHTML=`<div class="lh"><h2>Produtos (${itens.length})</h2><input id="busca" placeholder="Buscar produto" value="${esc(busca)}"><select id="fcat"><option value="">Todas as categorias</option>${CATEGORIAS.map(c=>`<option${c===catF?" selected":""}>${esc(c)}</option>`).join("")}</select><button class="pri" id="novo">+ Novo produto</button></div><div id="rows"></div>`;
 $("busca").oninput=e=>{busca=e.target.value;rows()};$("fcat").onchange=e=>{catF=e.target.value;rows()};
 $("novo").onclick=()=>abrir("novo");
 rows();
}
function thumb(p){return p.foto_url?`<img class="th" src="${esc(p.foto_url)}" alt="">`:`<div class="th"></div>`}
function rows(){
 const q=busca.toLowerCase(),l=itens.filter(p=>p.nome.toLowerCase().includes(q)&&(!catF||p.categoria===catF));
 $("rows").innerHTML=l.map(p=>`<div class="it${p.id===sel?" on":""}" data-id="${p.id}">${thumb(p)}<div class="inf"><b>${esc(p.nome)}</b><span>${brl(Number(p.preco))}${p.categoria?" · "+esc(p.categoria):""}${p.ativo?"":" · oculto"}${tot(p)!==null?" · "+tot(p)+" un.":""}${baixo(p)?` · <span class="low">estoque baixo</span>`:""}</span></div>${p.mais_vendido?`<span class="tag" title="Mais vendido">★</span>`:""}</div>`).join("")||`<p class="dica">Nenhum produto.</p>`;
 $("rows").querySelectorAll(".it").forEach(r=>r.onclick=()=>abrir(r.dataset.id));
}
function abrir(id){
 sel=id;if(d.fotos)d.fotos.forEach(f=>{if(f.file)URL.revokeObjectURL(f.url)})
 const p=id==="novo"?{ativo:true}:itens.find(x=>x.id===id);
 d={nome:p.nome||"",preco:p.preco!=null?String(p.preco).replace(".",","):"",categoria:p.categoria||"",variedade:p.variedade||"",tamanhos:tams(p.tamanhos),descricao:p.descricao||"",ativo:p.ativo!==false,mais_vendido:!!p.mais_vendido,estoque:Object.assign({},p.estoque||{}),fotos:(Array.isArray(p.fotos)&&p.fotos.length?p.fotos:(p.foto_url?[p.foto_url]:[])).map(u=>({url:u}))};
 $("app").classList.add("edit");rows();editor();prev();$("editor").scrollTop=0;scrollTo(0,0);
}
function selCat(v){const l=CATEGORIAS.slice();if(v&&!l.includes(v))l.push(v);return `<select id="cat"><option value="">Escolha...</option>${l.map(c=>`<option${c===v?" selected":""}>${esc(c)}</option>`).join("")}</select>`}
function selVar(c,v){const l=(VARIEDADES[c]||[]).slice();if(v&&!l.includes(v))l.push(v);if(!l.length)return"";return `<label>Variedade</label><select id="vari"><option value="">Nenhuma</option>${l.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}</select>`}
function chips(){const l=TAMANHOS.slice();d.tamanhos.forEach(t=>{if(!l.includes(t))l.push(t)});return `<div class="chips">${l.map(t=>`<label><input type="checkbox" name="tam" value="${esc(t)}"${d.tamanhos.includes(t)?" checked":""}><span>${esc(t)}</span></label>`).join("")}</div>`}
function fotoUI(){
 const F=d.fotos,box=$("fotobox");
 box.innerHTML=F.length?`<div class="fgrid">${F.map((f,i)=>`<div class="fi" data-i="${i}"><img src="${esc(f.url)}" alt="">${i===0?`<em class="cv">Capa</em>`:""}<div class="fb"><button type="button" data-m="-1"${i===0?" disabled":""} aria-label="Mover para a esquerda">◀</button><button type="button" data-m="1"${i===F.length-1?" disabled":""} aria-label="Mover para a direita">▶</button><button type="button" data-r="1" aria-label="Remover foto">×</button></div></div>`).join("")}</div><p class="fdica">${F.some(f=>f.file)?"Fotos novas só são salvas ao clicar em Salvar. ":""}No site, ao passar o mouse, as fotos trocam na ordem mostrada aqui.</p>`:`<p class="fdica">Sem foto. Escolha uma ou mais abaixo.</p>`;
 box.querySelectorAll(".fi").forEach(el=>{
  const i=+el.dataset.i;
  el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const k=i+Number(b.dataset.m);if(k<0||k>=F.length)return;[F[i],F[k]]=[F[k],F[i]];fotoUI();prev()});
  el.querySelector("[data-r]").onclick=()=>{const f=F.splice(i,1)[0];if(f.file)URL.revokeObjectURL(f.url);fotoUI();prev()};
 });
}
function editor(){
 const ed=$("editor");
 if(sel===null){ed.innerHTML=`<div class="vazio2"><p>Escolha um produto na lista ou clique em “+ Novo produto”.</p></div>`;return}
 const novo=sel==="novo";
 ed.innerHTML=`<div class="edhead"><b>${novo?"Novo produto":"Editar produto"}</b><button class="x" id="fechar" aria-label="Fechar">×</button></div>
<div class="fld"><label>Fotos (a 1ª é a capa)</label><div id="fotobox"></div><input id="foto" type="file" accept="image/*" multiple></div>
<div class="fld"><label>Nome</label><input id="nome" value="${esc(d.nome)}"></div>
<div class="fld"><label>Preço (ex: 129,90)</label><input id="preco" inputmode="decimal" value="${esc(d.preco)}"></div>
<div class="fld"><label>Categoria</label>${selCat(d.categoria)}<div id="varbox">${selVar(d.categoria,d.variedade)}</div></div>
<div class="fld"><label>Tamanhos (marque os que tem)</label>${chips()}</div>
<div class="fld" id="estbox"></div>
<div class="fld"><label>Descrição</label><textarea id="desc" rows="3">${esc(d.descricao)}</textarea></div>
<div class="fld"><label class="chk"><input id="ativo" type="checkbox"${d.ativo?" checked":""}> Mostrar no catálogo</label><label class="chk"><input id="mv" type="checkbox"${d.mais_vendido?" checked":""}> Mais vendido</label></div>
<div class="barra"><button class="pri" id="salvar">Salvar</button>${novo?"":`<button class="sec" id="dup">Duplicar</button><button class="sec" id="excluir">Excluir</button>`}<span class="msg" id="msg">${esc(aviso)}</span></div>`;
 aviso="";fotoUI();estUI();
 $("fechar").onclick=()=>{sel=null;$("app").classList.remove("edit");rows();editor();prev()};
 ed.oninput=ed.onchange=e=>{const t=e.target;
  if(t.id==="nome")d.nome=t.value;else if(t.id==="preco")d.preco=t.value;else if(t.id==="desc")d.descricao=t.value;
  else if(t.id==="cat"){d.categoria=t.value;d.variedade="";$("varbox").innerHTML=selVar(d.categoria,"")}
  else if(t.id==="vari")d.variedade=t.value;
  else if(t.name==="tam"){d.tamanhos=[...ed.querySelectorAll("input[name=tam]:checked")].map(i=>i.value);estUI()}
  else if(t.dataset.e!==undefined){const v=t.value.trim();if(v==="")delete d.estoque[t.dataset.e];else d.estoque[t.dataset.e]=Math.max(0,parseInt(v)||0)}
  else if(t.id==="ativo")d.ativo=t.checked;else if(t.id==="mv")d.mais_vendido=t.checked;
  else if(t.id==="foto"){[...t.files].forEach(f=>d.fotos.push({file:f,url:URL.createObjectURL(f)}));t.value="";fotoUI()}
  prev()};
 $("salvar").onclick=salvar;if($("excluir"))$("excluir").onclick=excluir;if($("dup"))$("dup").onclick=()=>{d.nome+=" (cópia)";sel="novo";aviso="";rows();editor();prev();$("editor").scrollTop=0};
}
function prev(){
 const c=$("prevcol"),topo=`<div class="tel-top"><b>Sua loja</b></div>`;
 if(sel===null){c.innerHTML=`<p class="rot">A prévia do produto aparece aqui.</p>`;return}
 const f=d.fotos[0]&&d.fotos[0].url;
 c.innerHTML=`<div class="tel">${topo}${f?`<img class="big" src="${esc(f)}" alt="">`:`<div class="ph big"></div>`}<div class="pad"><p class="rot">Prévia no celular${d.fotos.length>1?" · "+d.fotos.length+" fotos":""}</p><h3>${esc(d.nome)||"Nome do produto"}</h3><div class="pr">${brl(num(d.preco))}</div><p class="ds">${esc(d.descricao)}</p><div class="sz">${d.tamanhos.map(t=>`<span>${esc(t)}</span>`).join("")}</div><div class="zapb">Adicionar ao carrinho</div></div></div>`;
}
const SQL_VENDAS="alter table produtos add column if not exists vendas integer not null default 0;";
const V=p=>Number(p.vendas)||0;
function vendidos(){
 const tem=!itens.length||"vendas" in itens[0];
 const com=itens.filter(p=>V(p)>0).sort((x,y)=>V(y)-V(x)||x.nome.localeCompare(y.nome,"pt"));
 const top=com.slice(0,10),max=top.length?V(top[0]):1;
 const total=com.reduce((s,p)=>s+V(p),0),rec=com.reduce((s,p)=>s+V(p)*(Number(p.preco)||0),0);
 const grafico=top.length?`<div class="mg" role="list">${top.map((p,i)=>`<div class="mrow" role="listitem"><div class="ml"><span class="mn">${i+1}º</span>${thumb(p)}<b title="${esc(p.nome)}">${esc(p.nome)}</b><span class="mq">${V(p)} ${V(p)===1?"venda":"vendas"} · ${Math.round(V(p)/total*100)}%</span></div><div class="bar"><i style="width:${Math.max(3,V(p)/max*100)}%"></i></div></div>`).join("")}</div>`:`<p class="vazio3">Nenhuma venda ainda. Assim que você finalizar vendas no Caixa, o gráfico aparece aqui.</p>`;
 $("vend").innerHTML=`<h1>Mais vendidos</h1><p class="sub">Só o que já foi vendido, em números.</p>
${tem?"":`<div class="warn"><b>Falta um passo no Supabase para contar as vendas.</b> Abra o SQL Editor, cole o comando abaixo e clique em Run. Depois atualize esta página.<code>${SQL_VENDAS}</code><button class="sec" id="cp">Copiar comando</button></div>`}
<div class="cards"><div class="kpi"><small>Peças vendidas</small><b>${total}</b></div><div class="kpi"><small>Receita estimada</small><b>${brl(rec)}</b></div><div class="kpi"><small>Produto líder</small><b>${com.length?esc(com[0].nome):"—"}</b></div></div>
<div class="box"><h2>Ranking de vendas<small>${com.length>10?"top 10":"por produto"}</small></h2>${grafico}</div>`;
 if($("cp"))$("cp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(SQL_VENDAS);$("cp").textContent="Copiado!"};
}
async function setVendas(p,n){
 n=Math.max(0,Math.floor(n)||0);
 const r=await db.from("produtos").update({vendas:n}).eq("id",p.id);
 if(r.error){alert("Erro ao salvar as vendas. Confira se o passo do Supabase foi feito.");return}
 p.vendas=n;vendidos();
}

// ===== VENDAS (pedidos enviados ao WhatsApp) E LUCRO =====
const pad=n=>String(n).padStart(2,"0");
const dk=x=>x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate());
const itensDe=o=>Array.isArray(o.itens)?o.itens:[];
const custoCalc=its=>its.reduce((s,i)=>s+(custos[i.id]||0)*(Number(i.q)||0),0);
const custoPed=o=>o.custo!=null?Number(o.custo):custoCalc(itensDe(o));
function wa(tel){const n=String(tel||"").replace(/\D/g,"");return n?"https://wa.me/"+(n.length<=11?"55":"")+n:""}
const PILL={pendente:'<span class="pill p">Pendente</span>',concluida:'<span class="pill c">✅ Concluída</span>',cancelada:'<span class="pill x">❌ Não concluída</span>'};
const AVISO_SQL='<div class="warn"><b>Falta criar as tabelas no Supabase.</b> Abra o SQL Editor, cole o conteúdo do arquivo <b>pedidos.sql</b> e clique em Run. Depois atualize esta página.</div>';

function pedidosUI(){
 const cnt=s=>pedidos.filter(o=>o.status===s).length;
 const l=pedidos.filter(o=>fPed==="todos"||o.status===fPed);
 const seg=[["pendente","Pendentes"],["concluida","Concluídas ✅"],["cancelada","Não concluídas ❌"],["todos","Todos"]];
 const linha=o=>{
  const its=itensDe(o),link=wa(o.cliente_tel),dt=new Date(o.criado).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const hrs=(Date.now()-new Date(o.criado))/36e5,late=o.status==="pendente"&&hrs>=2?` · <span class="pill x">⏰ há ${Math.floor(hrs)}h</span>`:"",btnwa=link&&o.status==="pendente"?`<a class="sec" style="display:inline-block;margin-top:6px;text-decoration:none;padding:4px 10px;font-size:.8rem" href="${esc(link)}?text=${encodeURIComponent("Oi "+o.cliente_nome+", vi seu pedido de "+brl(Number(o.total))+". Posso confirmar?")}" target="_blank" rel="noopener">💬 Chamar no WhatsApp</a>`:"";

 B.forEach((b,i)=>{
  const x=pl+i*bw+bw*.1,h1=b.rec/mx*ch,h2=Math.max(0,b.luc)/mx*ch;
  s+=`<rect x="${x}" y="${pt+ch-h1}" width="${w}" height="${h1}" rx="2" fill="#111"><title>${b.l} · receita ${brl(b.rec)}</title></rect><rect x="${x+w+2}" y="${pt+ch-h2}" width="${w}" height="${h2}" rx="2" fill="#1b7f3b"><title>${b.l} · lucro ${brl(b.luc)}</title></rect>`;

var cal={cur:"0",prev:null,op:null,fresh:false},calM=null,calD=null;
const OPS={"+":(a,b)=>a+b,"−":(a,b)=>a-b,"×":(a,b)=>a*b,"÷":(a,b)=>a/b};
function calShow(){const x=$("cdp"),y=$("cdh");if(x){x.textContent=cal.cur.replace(".",",");y.textContent=cal.op?String(cal.prev).replace(".",",")+" "+cal.op:"\u00a0"}}
function calcKey(k){const c=cal;
 if(/^\d$/.test(k)){c.cur=(c.cur==="0"||c.fresh||c.cur==="Erro")?k:c.cur+k;c.fresh=false}
 else if(k===","){if(c.fresh||c.cur==="Erro"){c.cur="0";c.fresh=false}if(!c.cur.includes("."))c.cur+="."}
 else if(k==="C")cal={cur:"0",prev:null,op:null,fresh:false};
 else if(k==="⌫")c.cur=c.cur.length>1&&c.cur!=="Erro"?c.cur.slice(0,-1):"0";
 else if(k==="%")c.cur=String(parseFloat(c.cur)/100);
 else{if(c.op&&!c.fresh){const r=OPS[c.op](c.prev,parseFloat(c.cur));c.cur=isFinite(r)?String(Math.round(r*1e9)/1e9):"Erro"}
  if(k==="="){c.op=null;c.prev=null}else{c.prev=parseFloat(c.cur);c.op=k}c.fresh=true}
 calShow();
}

${semCup?`<div class="warn"><b>Falta um passo no Supabase.</b> Cole no SQL Editor, clique em Run e atualize a página.<code style="white-space:pre-wrap">${esc(SQL_CUPOM)}</code><button class="sec" id="cp">Copiar comando</button></div>`:""}
<div class="box"><h2>Novo cupom</h2><div class="vr" style="flex-wrap:wrap"><input id="kc" placeholder="Código, ex: BEMVINDO10" style="flex:2;min-width:150px;text-transform:uppercase"><select id="kt"><option value="percent">% de desconto</option><option value="valor">R$ de desconto</option></select><input id="kv" inputmode="decimal" placeholder="Valor" style="width:90px"></div><div class="vr" style="flex-wrap:wrap"><label class="cinp">Pedido mínimo R$<input id="km" inputmode="decimal" placeholder="0,00"></label><label class="cinp">Válido até<input id="kd" type="date"></label><button class="pri" id="ka"${semCup?" disabled":""}>Criar cupom</button></div></div>
<div class="box"><h2>Meus cupons<small>${cupons.length}</small></h2>${cupons.map(c=>{const u=usos(c),tot=u.reduce((a,o)=>a+Math.abs(itensDe(o).filter(i=>i.n===nm(c)).reduce((x,i)=>x+i.p*i.q,0)),0);return `<div class="vr"><div class="inf"><b>${esc(c.codigo)}</b><span>${c.tipo==="percent"?esc(c.valor)+"% de desconto":brl(Number(c.valor))+" de desconto"}${Number(c.minimo)>0?" · mín. "+brl(Number(c.minimo)):""}${c.valido_ate?" · até "+esc(String(c.valido_ate).split("-").reverse().join("/")):""} · ${on(c)?"ativo":c.ativo?"expirado":"desativado"} · usado ${u.length}x (${brl(tot)} em descontos)</span></div><button class="sec" data-kt="${esc(c.codigo)}">${c.ativo?"Desativar":"Ativar"}</button><button class="sec" data-kx="${esc(c.codigo)}" aria-label="Excluir cupom">×</button></div>`}).join("")||`<p class="vazio3">Nenhum cupom criado ainda.</p>`}</div>`;
 ptBind();if($("cp"))$("cp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(SQL_CUPOM);$("cp").textContent="Copiado!"};
 $("ka").onclick=async()=>{const c=$("kc").value.trim().toUpperCase().replace(/\s+/g,""),v=num($("kv").value),t=$("kt").value,m=$("km").value.trim()?num($("km").value):0;
  if(!c||isNaN(v)||v<=0||(t==="percent"&&v>100)||isNaN(m)||m<0){alert("Preencha o código e um valor válido (a porcentagem vai até 100).");return}
  if(cupons.some(x=>x.codigo===c)){alert("Já existe um cupom com esse código.");return}
  const r=await db.from("cupons").insert({codigo:c,tipo:t,valor:v,minimo:m,valido_ate:$("kd").value||null}).select().single();
  if(r.error){alert("Erro ao criar o cupom. Rode o SQL mostrado nesta tela.");return}cupons.unshift(r.data);cupomUI()};
 document.querySelectorAll("[data-kt]").forEach(b=>b.onclick=async()=>{const c=cupons.find(x=>x.codigo===b.dataset.kt),r=await db.from("cupons").update({ativo:!c.ativo}).eq("codigo",c.codigo);if(r.error){alert("Erro ao salvar.");return}c.ativo=!c.ativo;cupomUI()});
 document.querySelectorAll("[data-kx]").forEach(b=>b.onclick=async()=>{if(!confirm("Excluir este cupom?"))return;const r=await db.from("cupons").delete().eq("codigo",b.dataset.kx);if(r.error){alert("Erro ao excluir.");return}cupons=cupons.filter(x=>x.codigo!==b.dataset.kx);cupomUI()});
}
db.auth.getSession().then(r=>r.data.session?carregar():login());
</script></body></html>
