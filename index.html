<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sua loja | Catálogo</title><meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="aviso">Enviamos · Todas as formas de pagamento</div>
<header class="topo"><a class="marca" href="#">Sua loja</a>
<nav><a href="#">Catálogo</a><a id="contato" target="_blank" rel="noopener">Contato</a><button class="cx-btn" id="cxbtn" type="button" aria-label="Abrir carrinho">Carrinho<i id="cxn">0</i></button></nav></header>
<main class="wrap" id="app">Carregando...</main>
<div class="cx" id="cx"><div class="cx-ov" data-x></div><aside class="cx-p" role="dialog" aria-label="Carrinho"><div class="cx-h"><b>Carrinho</b><button type="button" data-x aria-label="Fechar">×</button></div><div class="cx-b" id="cxb"></div><div class="cx-f" id="cxf"><div class="cx-t"><span>Total</span><span id="cxt"></span></div><div class="cx-fm"><label for="cxnome">Nome *</label><input id="cxnome" autocomplete="name" placeholder="Seu nome"><label for="cxtel">Telefone (opcional)</label><input id="cxtel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(32) 99999-9999"><p class="cx-e" id="cxe" role="alert"></p></div><button class="cx-c" id="cxc" type="button">Comprar</button><button class="cx-k" type="button" data-x>Continuar comprando</button></div></aside></div>
<footer><span id="rod"></span></footer>
<script>
document.title="Sua loja | Catálogo";document.getElementById("rod").textContent="© Sua loja";
document.getElementById("contato").href="https://wa.me/"+WHATSAPP;
var db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),app=document.getElementById("app"),fi=0,P=[],cat="Todos",tam=null,sel=[],vari=null,aberto=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function brl(v){return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function promo(p){var v=Number(p.preco_promo);return v>0&&v<Number(p.preco)&&(!p.promo_ate||String(p.promo_ate)>=new Date().toISOString().slice(0,10))?v:0}
function brl2(p){var v=promo(p);return v?'<s style="color:#999;font-weight:400">'+brl(p.preco)+'</s> <b>'+brl(v)+'</b>':brl(p.preco)}
function tams(p){var a=String(p.tamanhos||"U").split(",").map(function(t){return t.trim()}).filter(Boolean),b=a.filter(function(t){return !(p.estoque&&p.estoque[t]===0)});return b.length?b:a}
function fotos(p){var f=Array.isArray(p.fotos)&&p.fotos.length?p.fotos:(p.foto_url?[p.foto_url]:[]);return f.filter(Boolean)}
function img(p,i){var f=fotos(p);i=i||0;if(i>=f.length)i=0;return f.length?'<div class="foto"><img src="'+esc(f[i])+'" alt="'+esc(p.nome)+'"></div>':'<div class="foto vazio"></div>'}
var HV=null;
function hoverFotos(card){
 var p=P.filter(function(x){return x.id===card.getAttribute("href").slice(1)})[0];if(!p)return;
 var f=fotos(p);if(f.length<2)return;
 var im=card.querySelector(".foto img"),k=0,t=null,pre=false;
 function passo(){k=(k+1)%f.length;im.src=f[k]}
 function entra(){if(!pre){pre=true;f.forEach(function(u){new Image().src=u})}clearInterval(t);passo();t=setInterval(passo,1000)}
 function sai(){clearInterval(t);t=null;k=0;im.src=f[0]}
 card.addEventListener("mouseenter",entra);card.addEventListener("mouseleave",sai);
}
var ORDEM=["PP","P","M","G","GG","XG","XGG","Único"];
function ordem(a,b){var i=ORDEM.indexOf(a),j=ORDEM.indexOf(b);if(i<0&&j<0)return(parseFloat(a)||0)-(parseFloat(b)||0);if(i<0)return 1;if(j<0)return-1;return i-j}
function lista(){
 if(!P.length){app.innerHTML="<p style='padding:24px 8px'>Nenhum produto cadastrado ainda.</p>";return}
 var cats=["Todos"].concat(P.some(function(p){return p.mais_vendido})?["Mais vendidos"]:[]).concat(P.map(function(p){return p.categoria}).filter(function(c,i,a){return c&&a.indexOf(c)===i}));
 var VV={};P.forEach(function(p){if(p.categoria&&p.variedade){VV[p.categoria]=VV[p.categoria]||[];if(VV[p.categoria].indexOf(p.variedade)<0)VV[p.categoria].push(p.variedade)}});
 for(var k in VV)VV[k].sort(function(a,b){return a.localeCompare(b,"pt")});
 var daCat=P.filter(function(p){return(cat==="Todos"||(cat==="Mais vendidos"?p.mais_vendido:p.categoria===cat))&&(!vari||p.variedade===vari)});
 var TT=[];daCat.forEach(function(p){tams(p).forEach(function(t){if(TT.indexOf(t)<0)TT.push(t)})});TT.sort(ordem);
 var it=daCat.filter(function(p){return !sel.length||tams(p).some(function(t){return sel.indexOf(t)>=0})});
 var abas=cats.map(function(c){var v=VV[c],at=c===cat?" ativo":"";
  if(!v)return '<button class="aba'+at+'" data-c="'+esc(c)+'">'+esc(c)+'</button>';
  return '<div class="drop'+(aberto===c?" aberto":"")+'"><button class="aba'+at+'" data-c="'+esc(c)+'">'+esc(c)+'<span class="seta"></span></button><div class="menu"><button data-vc="'+esc(c)+'" data-v="" class="'+(c===cat&&!vari?"ativo":"")+'">Todas</button>'+v.map(function(x){return '<button data-vc="'+esc(c)+'" data-v="'+esc(x)+'" class="'+(c===cat&&vari===x?"ativo":"")+'">'+esc(x)+'</button>'}).join("")+'</div></div>'}).join("");
 app.innerHTML='<div class="intro"><h1>Sua loja</h1></div><div class="abas">'+abas+'</div><div class="loja"><aside class="filtro"><h3>Tamanho</h3><div class="tams">'+TT.map(function(t){return '<button data-f="'+esc(t)+'" class="'+(sel.indexOf(t)>=0?"ativo":"")+'">'+esc(t)+'</button>'}).join("")+'</div>'+(sel.length?'<button class="limpar" id="limpar">Limpar filtro</button>':'')+'</aside><div><p class="conta">'+it.length+(it.length===1?" produto":" produtos")+(vari?" · "+esc(vari):"")+'</p>'+(it.length?'<div class="grade">'+it.map(function(p){return '<a class="card" href="#'+p.id+'">'+img(p)+'<h2>'+esc(p.nome)+'</h2><p>'+brl2(p)+'</p></a>'}).join("")+'</div>':'<p class="conta">Nenhum produto nesse tamanho.</p>')+'</div></div>';
 app.querySelectorAll("a.card").forEach(hoverFotos);
 app.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){var c=b.dataset.c;aberto=VV[c]?(aberto===c?null:c):null;if(cat!==c){cat=c;vari=null;sel=[]}lista()}});
 app.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){cat=b.dataset.vc;vari=b.dataset.v||null;sel=[];aberto=null;lista()}});
 app.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){var t=b.dataset.f,i=sel.indexOf(t);if(i<0)sel.push(t);else sel.splice(i,1);lista()}});
 var l=document.getElementById("limpar");if(l)l.onclick=function(){sel=[];lista()};
}
document.addEventListener("click",function(e){if(aberto&&!e.target.closest(".drop")){aberto=null;if(document.querySelector(".abas"))lista()}});

var PEDIDO={linhas:[],total:0};
var CART=[];try{CART=JSON.parse(localStorage.getItem("cart")||"[]")}catch(e){}
function salvaCart(){try{localStorage.setItem("cart",JSON.stringify(CART))}catch(e){}}
function cartQtd(){return CART.reduce(function(s,i){return s+i.q},0)}
function addCart(p,t){
 var i=CART.filter(function(x){return x.id===p.id&&x.t===t})[0];
 if(i)i.q++;else CART.push({id:p.id,n:p.nome,p:(promo(p)||Number(p.preco)),t:t,q:1,f:p.foto_url||""});
 salvaCart();cartUI(true);
}
var CUPOM=null,CUPMSG="";
function cupomHTML(d){var h='<div style="padding:14px 0 0">';
 if(CUPOM)h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem"><span>Cupom <b>'+esc(CUPOM.codigo)+'</b>: -'+brl(d)+'</span><button type="button" id="cpx" style="background:none;border:0;text-decoration:underline;cursor:pointer;color:inherit;font:inherit">Remover</button></div>';
 else h+='<div class="cp-l"><input class="cp-i" id="cpi" placeholder="Cupom de desconto" autocapitalize="characters"><button type="button" class="cp-b" id="cpa">Aplicar</button></div>';
 if(CUPMSG)h+='<p style="margin:6px 0 0;font-size:.85rem;color:#b3261e">'+esc(CUPMSG)+'</p>';
 return h+'</div>'}
function aplicaCupom(){var el=document.getElementById("cpi"),c=(el&&el.value||"").trim().toUpperCase();if(!c)return;var tot=CART.reduce(function(s,x){return s+x.p*x.q},0);
 db.rpc("validar_cupom",{p_codigo:c,p_total:tot}).then(function(r){var d=r.data;if(r.error||!d){CUPMSG="Não foi possível validar o cupom agora.";CUPOM=null}else if(!d.ok){CUPMSG=d.msg||"Cupom inválido.";CUPOM=null}else{CUPMSG="";CUPOM={codigo:d.codigo,tipo:d.tipo,valor:Number(d.valor),minimo:Number(d.minimo)||0}}cartUI()},function(){CUPMSG="Não foi possível validar o cupom agora.";cartUI()})}
document.addEventListener("click",function(e){var id=e.target&&e.target.id;if(id==="cpa")aplicaCupom();else if(id==="cpx"){CUPOM=null;CUPMSG="";cartUI()}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target&&e.target.id==="cpi"){e.preventDefault();aplicaCupom()}});
function cartUI(abrir){
 var box=document.getElementById("cx"),b=document.getElementById("cxb"),f=document.getElementById("cxf");
 document.getElementById("cxn").textContent=cartQtd();
 if(abrir)box.classList.add("on");
 if(!CART.length){b.innerHTML='<p class="cx-v">Seu carrinho está vazio.</p>';f.classList.remove("on");return}
 var total=0,linhas=[];
 b.innerHTML=CART.map(function(i,k){total+=i.p*i.q;linhas.push("• "+i.q+"x "+i.n+" (tam. "+i.t+") - "+brl(i.p*i.q));
  return '<div class="cx-i">'+(i.f?'<img src="'+esc(i.f)+'" alt="">':'<div class="cx-f0"></div>')+'<div class="cx-d"><b>'+esc(i.n)+'</b><small>Tamanho '+esc(i.t)+'</small><div class="cx-q"><button type="button" data-k="'+k+'" data-d="-1" aria-label="Diminuir">−</button><span>'+i.q+'</span><button type="button" data-k="'+k+'" data-d="1" aria-label="Aumentar">+</button><button type="button" class="cx-r" data-k="'+k+'" data-d="0">Remover</button></div></div><span class="cx-pr">'+brl(i.p*i.q)+'</span></div>'}).join("");
 var desc=0;
 if(CUPOM){if(total<CUPOM.minimo){CUPOM=null;CUPMSG="Cupom removido: pedido abaixo do mínimo."}else{var dd=CUPOM.tipo==="percent"?total*CUPOM.valor/100:CUPOM.valor;desc=Math.min(total,Math.round(dd*100)/100);CUPOM.d=desc;linhas.push("• Cupom "+CUPOM.codigo+": -"+brl(desc))}}
 b.insertAdjacentHTML("beforeend",cupomHTML(desc));
 document.getElementById("cxt").textContent=brl(total-desc);
 PEDIDO={linhas:linhas,total:total-desc};
 f.classList.add("on");
}
document.getElementById("cxbtn").onclick=function(){cartUI(true)};
document.getElementById("cx").addEventListener("click",function(e){
 if(e.target.closest("[data-x]")){this.classList.remove("on");return}
 var b=e.target.closest("[data-k]");if(!b)return;
 var k=+b.dataset.k,d=+b.dataset.d;
 if(d===0||CART[k].q+d<1)CART.splice(k,1);else CART[k].q+=d;
 salvaCart();cartUI();
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")document.getElementById("cx").classList.remove("on")});
(function(){
 var n=document.getElementById("cxnome"),t=document.getElementById("cxtel"),e=document.getElementById("cxe");
 try{n.value=localStorage.getItem("cliente_nome")||"";t.value=localStorage.getItem("cliente_tel")||""}catch(x){}
 function erro(m,c){e.textContent=m;n.classList.remove("bad");t.classList.remove("bad");if(c){c.classList.add("bad");c.focus()}}
 n.oninput=t.oninput=function(){erro("")};
 document.getElementById("cxc").onclick=function(){
  var nome=n.value.trim(),tel=t.value.trim();
  if(!nome){erro("Digite seu nome para continuar.",n);return}
  if(tel&&tel.replace(/\D/g,"").length<10){erro("Telefone incompleto. Coloque o DDD ou deixe em branco.",t);return}
  erro("");
  try{localStorage.setItem("cliente_nome",nome);localStorage.setItem("cliente_tel",tel)}catch(x){}
  var msg="Nome: "+nome+"\nTelefone: "+(tel||"não informado")+"\n\nPedido:\n"+PEDIDO.linhas.join("\n")+"\n\nTotal: "+brl(PEDIDO.total);
  var sig=nome+"|"+PEDIDO.total+"|"+PEDIDO.linhas.join();
  if(window._ps!==sig){window._ps=sig;try{db.from("pedidos").insert({cliente_nome:nome,cliente_tel:tel||null,itens:CART.map(function(x){return{id:x.id,n:x.n,p:x.p,t:x.t,q:x.q}}).concat(CUPOM&&CUPOM.d>0?[{id:null,n:"Cupom "+CUPOM.codigo,p:-CUPOM.d,t:"-",q:1}]:[]),total:PEDIDO.total}).then(function(r){if(r.error)console.error(r.error)},function(){})}catch(x){}}
  var url="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg);
  if(!window.open(url,"_blank"))location.href=url;
 };
})();
cartUI();
function prod(p){
 var T=tams(p);if(!tam||T.indexOf(tam)<0)tam=T[0];
 var F=fotos(p);if(fi>=F.length)fi=0;
 app.innerHTML='<a class="voltar" href="#">← Voltar</a><div class="detalhe"><div><div class="gal">'+img(p,fi)+(F.length>1?'<button type="button" class="gs ant" data-g="-1" aria-label="Foto anterior">‹</button><button type="button" class="gs prox" data-g="1" aria-label="Próxima foto">›</button><span class="gc">'+(fi+1)+' / '+F.length+'</span>':'')+'</div>'+(F.length>1?'<div class="galeria">'+F.map(function(u,i){return '<button type="button" data-i="'+i+'" class="'+(i===fi?"ativo":"")+'" aria-label="Foto '+(i+1)+'"><img src="'+esc(u)+'" alt=""></button>'}).join("")+'</div>':'')+'</div><div class="info"><h1>'+esc(p.nome)+'</h1><p class="preco">'+brl2(p)+'</p><p>'+esc(p.descricao)+'</p><p class="rotulo">Tamanho</p><div class="tams">'+T.map(function(t){return '<button data-t="'+esc(t)+'" class="'+(t===tam?"ativo":"")+'">'+esc(t)+'</button>'}).join("")+'</div><button class="zap" id="addc" type="button">Adicionar ao carrinho</button></div></div>';
 app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){tam=b.dataset.t;prod(p)}});
 app.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){fi=+b.dataset.i;prod(p)}});
 document.getElementById("addc").onclick=function(){addCart(p,tam)};
 window._go=function(d){fi=(fi+d+F.length)%F.length;prod(p)};
 app.querySelectorAll("[data-g]").forEach(function(b){b.onclick=function(){window._go(+b.dataset.g)}});
 var gl=app.querySelector(".gal"),x0=null;
 if(gl&&F.length>1){gl.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});gl.addEventListener("touchend",function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40)window._go(dx<0?1:-1)})}
}
document.addEventListener("keydown",function(e){if((e.key==="ArrowLeft"||e.key==="ArrowRight")&&app.querySelector(".gal .gs")&&!document.getElementById("cx").classList.contains("on")&&!/INPUT|TEXTAREA/.test(e.target.tagName||""))window._go(e.key==="ArrowLeft"?-1:1)});
function rota(){var id=location.hash.slice(1),p=P.filter(function(x){return x.id===id})[0];if(p){tam=null;fi=0;prod(p)}else lista();scrollTo(0,0)}
db.from("produtos").select("*").eq("ativo",true).order("criado",{ascending:false}).then(function(r){
 if(r.error){app.textContent="Não foi possível carregar o catálogo.";return}
 P=r.data;CART.forEach(function(i){var p=P.filter(function(x){return x.id===i.id})[0];if(p){i.n=p.nome;i.p=(promo(p)||Number(p.preco));i.f=p.foto_url||""}});salvaCart();cartUI();rota();addEventListener("hashchange",rota);
});
</script></body></html>
