<style>
img.lema-img{display:block;width:min(560px,90%);height:auto;margin:0 0 10px}
button.zap{border:0;font:inherit;cursor:pointer}
.galeria{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.galeria button{width:56px;height:70px;padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;background:#f2f2ef;cursor:pointer;opacity:.7}
.galeria button.ativo{border-color:#111;opacity:1}
.galeria img{width:100%;height:100%;object-fit:cover;display:block}
.cx-btn{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0}
.cx-btn i{font-style:normal;display:inline-block;min-width:20px;padding:1px 6px;margin-left:4px;border-radius:10px;background:#111;color:#fff;font-size:.75rem;text-align:center}
.cx{position:fixed;inset:0;z-index:50;display:none}.cx.on{display:block}
.cx-ov{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.cx-p{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.cx-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #e4e4e0;font-size:1.05rem}
.cx-h button{border:0;background:none;font-size:1.8rem;line-height:1;cursor:pointer;color:#555}
.cx-b{flex:1;overflow:auto;padding:6px 18px}
.cx-v{padding:40px 0;text-align:center;color:#777}
.cx-i{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #eee}
.cx-i img,.cx-i .cx-f0{width:56px;height:70px;object-fit:cover;border-radius:6px;background:#f2f2ef;flex:none}
.cx-i .cx-d{flex:1;min-width:0}.cx-i b{display:block;font-weight:600}.cx-i small{color:#777}
.cx-q{display:flex;align-items:center;gap:6px;margin-top:8px}
.cx-q button{width:30px;height:30px;border:1px solid #d6d6d1;border-radius:8px;background:#fff;font-size:1rem;cursor:pointer}
.cx-q span{min-width:22px;text-align:center}
.cx-q .cx-r{width:auto;margin-left:auto;border:0;background:none;color:#b3261e;font-size:.8rem;text-decoration:underline}
.cx-pr{font-weight:600;white-space:nowrap}
.cx-f{padding:16px 18px;border-top:1px solid #e4e4e0;display:none}
.cx-f.on{display:block}
.cx-t{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:700;margin-bottom:12px}
.cx-c{display:block;background:#111;color:#fff;text-align:center;text-decoration:none;padding:14px;border-radius:8px;font-weight:700}
button.cx-c{width:100%;border:0;font:inherit;font-weight:700;cursor:pointer}
.cx-fm{margin-bottom:12px}.cx-fm label{display:block;font-size:.8rem;font-weight:600;color:#555;margin:0 0 4px}

.cx-k{display:block;width:100%;margin-top:8px;padding:10px;border:0;background:none;color:#555;cursor:pointer;font:inherit;text-decoration:underline}

  if(tel&&tel.replace(/\D/g,"").length<10){erro("Telefone incompleto. Coloque o DDD ou deixe em branco.",t);return}
  erro("");
  try{localStorage.setItem("cliente_nome",nome);localStorage.setItem("cliente_tel",tel)}catch(x){}
  var msg="Nome: "+nome+"\nTelefone: "+(tel||"não informado")+"\n\nPedido:\n"+PEDIDO.linhas.join("\n")+"\n\nTotal: "+brl(PEDIDO.total);
  var url="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg);
  if(!window.open(url,"_blank"))location.href=url;
 };
})();
cartUI();
function prod(p){
 var T=tams(p);if(!tam||T.indexOf(tam)<0)tam=T[0];
 var F=fotos(p);if(fi>=F.length)fi=0;
 app.innerHTML='<a class="voltar" href="#">← Voltar</a><div class="detalhe"><div>'+img(p,fi)+(F.length>1?'<div class="galeria">'+F.map(function(u,i){return '<button type="button" data-i="'+i+'" class="'+(i===fi?"ativo":"")+'" aria-label="Foto '+(i+1)+'"><img src="'+esc(u)+'" alt=""></button>'}).join("")+'</div>':'')+'</div><div class="info"><h1>'+esc(p.nome)+'</h1><p class="preco">'+brl(p.preco)+'</p><p>'+esc(p.descricao)+'</p><p class="rotulo">Tamanho</p><div class="tams">'+T.map(function(t){return '<button data-t="'+esc(t)+'" class="'+(t===tam?"ativo":"")+'">'+esc(t)+'</button>'}).join("")+'</div><button class="zap" id="addc" type="button">Adicionar ao carrinho</button></div></div>';
 app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){tam=b.dataset.t;prod(p)}});
 app.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){fi=+b.dataset.i;prod(p)}});
 document.getElementById("addc").onclick=function(){addCart(p,tam)};
}
function rota(){var id=location.hash.slice(1),p=P.filter(function(x){return x.id===id})[0];if(p){tam=null;fi=0;prod(p)}else lista();scrollTo(0,0)}
db.from("produtos").select("*").eq("ativo",true).order("criado",{ascending:false}).then(function(r){
 if(r.error){app.textContent="Não foi possível carregar o catálogo.";return}
 P=r.data;CART.forEach(function(i){var p=P.filter(function(x){return x.id===i.id})[0];if(p){i.n=p.nome;i.p=Number(p.preco);i.f=p.foto_url||""}});salvaCart();cartUI();rota();addEventListener("hashchange",rota);
});
</script></body></html>
