<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
button.zap{border:0;font:inherit;cursor:pointer}
.cx-btn{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0}
.cx-btn i{font-style:normal;display:inline-block;min-width:20px;padding:1px 6px;margin-left:4px;border-radius:10px;background:#111;color:#fff;font-size:.75rem;text-align:center}
.cx{position:fixed;inset:0;z-index:50;display:none}.cx.on{display:block}
.cx-ov{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.cx-p{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.cx-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #e4e4e0;font-size:1.05rem}
.cx-h button{border:0;background:none;font-size:1.8rem;line-height:1;cursor:pointer;color:#555}
.cx-b{flex:1;overflow:auto;padding:6px 18px}
.cx-v{padding:40px 0;text-align:center;color:#777}
.cx-i{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #eee}
.cx-i img,.cx-i .cx-f0{width:56px;height:70px;object-fit:cover;border-radius:6px;background:#f2f2ef;flex:none}
.cx-i .cx-d{flex:1;min-width:0}.cx-i b{display:block;font-weight:600}.cx-i small{color:#777}
.cx-q{display:flex;align-items:center;gap:6px;margin-top:8px}
.cx-q button{width:30px;height:30px;border:1px solid #d6d6d1;border-radius:8px;background:#fff;font-size:1rem;cursor:pointer}
.cx-q span{min-width:22px;text-align:center}
.cx-q .cx-r{width:auto;margin-left:auto;border:0;background:none;color:#b3261e;font-size:.8rem;text-decoration:underline}
.cx-pr{font-weight:600;white-space:nowrap}
.cx-f{padding:16px 18px;border-top:1px solid #e4e4e0;display:none}
.cx-f.on{display:block}
.cx-t{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:700;margin-bottom:12px}
.cx-c{display:block;background:#111;color:#fff;text-align:center;text-decoration:none;padding:14px;border-radius:8px;font-weight:700}
.cx-k{display:block;width:100%;margin-top:8px;padding:10px;border:0;background:none;color:#555;cursor:pointer;font:inherit;text-decoration:underline}
</style>
</head>
<body>
<div class="aviso">Enviamos · Todas as formas de pagamento</div>
<header class="topo"><a class="marca" href="#"><img src="logo.png" alt=""><span id="logo"></span></a>
<nav><a href="#">Catálogo</a><a id="contato" target="_blank" rel="noopener">Contato</a><button class="cx-btn" id="cxbtn" type="button" aria-label="Abrir carrinho">Carrinho<i id="cxn">0</i></button></nav></header>
<main class="wrap" id="app">Carregando...</main>
<div class="cx" id="cx"><div class="cx-ov" data-x></div><aside class="cx-p" role="dialog" aria-label="Carrinho"><div class="cx-h"><b>Carrinho</b><button type="button" data-x aria-label="Fechar">×</button></div><div class="cx-b" id="cxb"></div><div class="cx-f" id="cxf"><div class="cx-t"><span>Total</span><span id="cxt"></span></div><a class="cx-c" id="cxc" target="_blank" rel="noopener">Comprar</a><button class="cx-k" type="button" data-x>Continuar comprando</button></div></aside></div>
<footer><span id="rod"></span><span>Pirapetinga-MG</span><a href="https://instagram.com/quebrada_beckas" target="_blank" rel="noopener">Instagram</a></footer>
<script>
document.getElementById("logo").textContent=LOJA;document.title=LOJA+" | Catálogo";document.getElementById("rod").textContent="© "+LOJA;
document.getElementById("contato").href="https://wa.me/"+WHATSAPP;
var db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),app=document.getElementById("app"),P=[],cat="Todos",tam=null,sel=[],vari=null,aberto=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function brl(v){return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function tams(p){return String(p.tamanhos||"U").split(",").map(function(t){return t.trim()}).filter(Boolean)}
function img(p){return p.foto_url?'<div class="foto"><img src="'+esc(p.foto_url)+'" alt="'+esc(p.nome)+'"></div>':'<div class="foto vazio"></div>'}
var ORDEM=["PP","P","M","G","GG","XG","XGG","Único"];
function ordem(a,b){var i=ORDEM.indexOf(a),j=ORDEM.indexOf(b);if(i<0&&j<0)return(parseFloat(a)||0)-(parseFloat(b)||0);if(i<0)return 1;if(j<0)return-1;return i-j}
function lista(){
 if(!P.length){app.innerHTML="<p style='padding:24px 8px'>Nenhum produto cadastrado ainda.</p>";return}
 var cats=["Todos"].concat(P.some(function(p){return p.mais_vendido})?["Mais vendidos"]:[]).concat(P.map(function(p){return p.categoria}).filter(function(c,i,a){return c&&a.indexOf(c)===i}));
 var VV={};P.forEach(function(p){if(p.categoria&&p.variedade){VV[p.categoria]=VV[p.categoria]||[];if(VV[p.categoria].indexOf(p.variedade)<0)VV[p.categoria].push(p.variedade)}});
 for(var k in VV)VV[k].sort(function(a,b){return a.localeCompare(b,"pt")});
 var daCat=P.filter(function(p){return(cat==="Todos"||(cat==="Mais vendidos"?p.mais_vendido:p.categoria===cat))&&(!vari||p.variedade===vari)});
 var TT=[];daCat.forEach(function(p){tams(p).forEach(function(t){if(TT.indexOf(t)<0)TT.push(t)})});TT.sort(ordem);
 var it=daCat.filter(function(p){return !sel.length||tams(p).some(function(t){return sel.indexOf(t)>=0})});
 var abas=cats.map(function(c){var v=VV[c],at=c===cat?" ativo":"";
  if(!v)return '<button class="aba'+at+'" data-c="'+esc(c)+'">'+esc(c)+'</button>';
  return '<div class="drop'+(aberto===c?" aberto":"")+'"><button class="aba'+at+'" data-c="'+esc(c)+'">'+esc(c)+'<span class="seta"></span></button><div class="menu"><button data-vc="'+esc(c)+'" data-v="" class="'+(c===cat&&!vari?"ativo":"")+'">Todas</button>'+v.map(function(x){return '<button data-vc="'+esc(c)+'" data-v="'+esc(x)+'" class="'+(c===cat&&vari===x?"ativo":"")+'">'+esc(x)+'</button>'}).join("")+'</div></div>'}).join("");
 app.innerHTML='<div class="intro"><p class="lema">A loja que fortalece os cria.</p><p class="local">Pirapetinga-MG</p></div><div class="abas">'+abas+'</div><div class="loja"><aside class="filtro"><h3>Tamanho</h3><div class="tams">'+TT.map(function(t){return '<button data-f="'+esc(t)+'" class="'+(sel.indexOf(t)>=0?"ativo":"")+'">'+esc(t)+'</button>'}).join("")+'</div>'+(sel.length?'<button class="limpar" id="limpar">Limpar filtro</button>':'')+'</aside><div><p class="conta">'+it.length+(it.length===1?" produto":" produtos")+(vari?" · "+esc(vari):"")+'</p>'+(it.length?'<div class="grade">'+it.map(function(p){return '<a class="card" href="#'+p.id+'">'+img(p)+'<h2>'+esc(p.nome)+'</h2><p>'+brl(p.preco)+'</p></a>'}).join("")+'</div>':'<p class="conta">Nenhum produto nesse tamanho.</p>')+'</div></div>';
 app.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){var c=b.dataset.c;aberto=VV[c]?(aberto===c?null:c):null;if(cat!==c){cat=c;vari=null;sel=[]}lista()}});
 app.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){cat=b.dataset.vc;vari=b.dataset.v||null;sel=[];aberto=null;lista()}});
 app.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){var t=b.dataset.f,i=sel.indexOf(t);if(i<0)sel.push(t);else sel.splice(i,1);lista()}});
 var l=document.getElementById("limpar");if(l)l.onclick=function(){sel=[];lista()};
}
document.addEventListener("click",function(e){if(aberto&&!e.target.closest(".drop")){aberto=null;if(document.querySelector(".abas"))lista()}});

var CART=[];try{CART=JSON.parse(localStorage.getItem("cart")||"[]")}catch(e){}
function salvaCart(){try{localStorage.setItem("cart",JSON.stringify(CART))}catch(e){}}
function cartQtd(){return CART.reduce(function(s,i){return s+i.q},0)}
function addCart(p,t){
 var i=CART.filter(function(x){return x.id===p.id&&x.t===t})[0];
 if(i)i.q++;else CART.push({id:p.id,n:p.nome,p:Number(p.preco),t:t,q:1,f:p.foto_url||""});
 salvaCart();cartUI(true);
}
function cartUI(abrir){
 var box=document.getElementById("cx"),b=document.getElementById("cxb"),f=document.getElementById("cxf");
 document.getElementById("cxn").textContent=cartQtd();
 if(abrir)box.classList.add("on");
 if(!CART.length){b.innerHTML='<p class="cx-v">Seu carrinho está vazio.</p>';f.classList.remove("on");return}
 var total=0,linhas=[];
 b.innerHTML=CART.map(function(i,k){total+=i.p*i.q;linhas.push("• "+i.q+"x "+i.n+" (tam. "+i.t+") - "+brl(i.p*i.q));
  return '<div class="cx-i">'+(i.f?'<img src="'+esc(i.f)+'" alt="">':'<div class="cx-f0"></div>')+'<div class="cx-d"><b>'+esc(i.n)+'</b><small>Tamanho '+esc(i.t)+'</small><div class="cx-q"><button type="button" data-k="'+k+'" data-d="-1" aria-label="Diminuir">−</button><span>'+i.q+'</span><button type="button" data-k="'+k+'" data-d="1" aria-label="Aumentar">+</button><button type="button" class="cx-r" data-k="'+k+'" data-d="0">Remover</button></div></div><span class="cx-pr">'+brl(i.p*i.q)+'</span></div>'}).join("");
 document.getElementById("cxt").textContent=brl(total);
 document.getElementById("cxc").href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Olá! Quero comprar:\n"+linhas.join("\n")+"\n\nTotal: "+brl(total));
 f.classList.add("on");
}
document.getElementById("cxbtn").onclick=function(){cartUI(true)};
document.getElementById("cx").addEventListener("click",function(e){
 if(e.target.closest("[data-x]")){this.classList.remove("on");return}
 var b=e.target.closest("[data-k]");if(!b)return;
 var k=+b.dataset.k,d=+b.dataset.d;
 if(d===0||CART[k].q+d<1)CART.splice(k,1);else CART[k].q+=d;
 salvaCart();cartUI();
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")document.getElementById("cx").classList.remove("on")});
cartUI();
function prod(p){
 var T=tams(p);if(!tam||T.indexOf(tam)<0)tam=T[0];
 app.innerHTML='<a class="voltar" href="#">← Voltar</a><div class="detalhe">'+img(p)+'<div class="info"><h1>'+esc(p.nome)+'</h1><p class="preco">'+brl(p.preco)+'</p><p>'+esc(p.descricao)+'</p><p class="rotulo">Tamanho</p><div class="tams">'+T.map(function(t){return '<button data-t="'+esc(t)+'" class="'+(t===tam?"ativo":"")+'">'+esc(t)+'</button>'}).join("")+'</div><button class="zap" id="addc" type="button">Adicionar ao carrinho</button></div></div>';
 app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){tam=b.dataset.t;prod(p)}});
 document.getElementById("addc").onclick=function(){addCart(p,tam)};
}
function rota(){var id=location.hash.slice(1),p=P.filter(function(x){return x.id===id})[0];if(p){tam=null;prod(p)}else lista();scrollTo(0,0)}
db.from("produtos").select("*").eq("ativo",true).order("criado",{ascending:false}).then(function(r){
 if(r.error){app.textContent="Não foi possível carregar o catálogo.";return}
 P=r.data;CART.forEach(function(i){var p=P.filter(function(x){return x.id===i.id})[0];if(p){i.n=p.nome;i.p=Number(p.preco);i.f=p.foto_url||""}});salvaCart();cartUI();rota();addEventListener("hashchange",rota);
});
</script></body></html>
