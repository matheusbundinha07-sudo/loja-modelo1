<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script></head>
<body>
<div class="aviso">Enviamos · Todas as formas de pagamento</div>
<header class="topo"><a class="marca" href="#"><img src="logo.png" alt=""><span id="logo"></span></a>
<nav><a href="#">Catálogo</a><a id="contato" target="_blank" rel="noopener">Contato</a></nav></header>
<main class="wrap" id="app">Carregando...</main>
<footer><span id="rod"></span><span>Pirapetinga-MG</span><a href="https://instagram.com/quebrada_beckas" target="_blank" rel="noopener">Instagram</a></footer>
<script>
document.getElementById("logo").textContent=LOJA;document.title=LOJA+" | Catálogo";document.getElementById("rod").textContent="© "+LOJA;
document.getElementById("contato").href="https://wa.me/"+WHATSAPP;
var db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),app=document.getElementById("app"),P=[],cat="Todos",tam=null,sel=[],vari=null,aberto=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function brl(v){return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function tams(p){return String(p.tamanhos||"U").split(",").map(function(t){return t.trim()}).filter(Boolean)}
function img(p){return p.foto_url?'<div class="foto"><img src="'+esc(p.foto_url)+'" alt="'+esc(p.nome)+'"></div>':'<div class="foto vazio"></div>'}
var ORDEM=["PP","P","M","G","GG","XG","XGG","Único"];
function ordem(a,b){var i=ORDEM.indexOf(a),j=ORDEM.indexOf(b);if(i<0&&j<0)return(parseFloat(a)||0)-(parseFloat(b)||0);if(i<0)return 1;if(j<0)return-1;return i-j}
function lista(){
 if(!P.length){app.innerHTML="<p style='padding:24px 8px'>Nenhum produto cadastrado ainda.</p>";return}
 var cats=["Todos"].concat(P.map(function(p){return p.categoria}).filter(function(c,i,a){return c&&a.indexOf(c)===i}));
 var VV={};P.forEach(function(p){if(p.categoria&&p.variedade){VV[p.categoria]=VV[p.categoria]||[];if(VV[p.categoria].indexOf(p.variedade)<0)VV[p.categoria].push(p.variedade)}});
 for(var k in VV)VV[k].sort(function(a,b){return a.localeCompare(b,"pt")});
 var daCat=P.filter(function(p){return(cat==="Todos"||p.categoria===cat)&&(!vari||p.variedade===vari)});
 var TT=[];daCat.forEach(function(p){tams(p).forEach(function(t){if(TT.indexOf(t)<0)TT.push(t)})});TT.sort(ordem);
 var it=daCat.filter(function(p){return !sel.length||tams(p).some(function(t){return sel.indexOf(t)>=0})});
 var abas=cats.map(function(c){var v=VV[c],at=c===cat?" ativo":"";
  if(!v)return '<button class="aba'+at+'" data-c="'+esc(c)+'">'+esc(c)+'</button>';
  return '<div class="drop'+(aberto===c?" aberto":"")+'"><button class="aba'+at+'" data-c="'+esc(c)+'">'+esc(c)+'<span class="seta"></span></button><div class="menu"><button data-vc="'+esc(c)+'" data-v="" class="'+(c===cat&&!vari?"ativo":"")+'">Todas</button>'+v.map(function(x){return '<button data-vc="'+esc(c)+'" data-v="'+esc(x)+'" class="'+(c===cat&&vari===x?"ativo":"")+'">'+esc(x)+'</button>'}).join("")+'</div></div>'}).join("");
 app.innerHTML='<div class="intro"><p class="lema">A loja que fortalece os cria.</p><p class="local">Pirapetinga-MG</p></div><div class="abas">'+abas+'</div><div class="loja"><aside class="filtro"><h3>Tamanho</h3><div class="tams">'+TT.map(function(t){return '<button data-f="'+esc(t)+'" class="'+(sel.indexOf(t)>=0?"ativo":"")+'">'+esc(t)+'</button>'}).join("")+'</div>'+(sel.length?'<button class="limpar" id="limpar">Limpar filtro</button>':'')+'</aside><div><p class="conta">'+it.length+(it.length===1?" produto":" produtos")+(vari?" · "+esc(vari):"")+'</p>'+(it.length?'<div class="grade">'+it.map(function(p){return '<a class="card" href="#'+p.id+'">'+img(p)+'<h2>'+esc(p.nome)+'</h2><p>'+brl(p.preco)+'</p></a>'}).join("")+'</div>':'<p class="conta">Nenhum produto nesse tamanho.</p>')+'</div></div>';
 app.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){var c=b.dataset.c;aberto=VV[c]?(aberto===c?null:c):null;if(cat!==c){cat=c;vari=null;sel=[]}lista()}});
 app.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){cat=b.dataset.vc;vari=b.dataset.v||null;sel=[];aberto=null;lista()}});
 app.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){var t=b.dataset.f,i=sel.indexOf(t);if(i<0)sel.push(t);else sel.splice(i,1);lista()}});
 var l=document.getElementById("limpar");if(l)l.onclick=function(){sel=[];lista()};
}
document.addEventListener("click",function(e){if(aberto&&!e.target.closest(".drop")){aberto=null;if(document.querySelector(".abas"))lista()}});
function prod(p){
 var T=tams(p);if(!tam||T.indexOf(tam)<0)tam=T[0];
 var m=encodeURIComponent('Olá! Quero o produto "'+p.nome+'", tamanho '+tam+'. Está disponível?');
 app.innerHTML='<a class="voltar" href="#">← Voltar</a><div class="detalhe">'+img(p)+'<div class="info"><h1>'+esc(p.nome)+'</h1><p class="preco">'+brl(p.preco)+'</p><p>'+esc(p.descricao)+'</p><p class="rotulo">Tamanho</p><div class="tams">'+T.map(function(t){return '<button data-t="'+esc(t)+'" class="'+(t===tam?"ativo":"")+'">'+esc(t)+'</button>'}).join("")+'</div><a class="zap" target="_blank" rel="noopener" href="https://wa.me/'+WHATSAPP+'?text='+m+'">Pedir pelo WhatsApp</a></div></div>';
 app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){tam=b.dataset.t;prod(p)}});
}
function rota(){var id=location.hash.slice(1),p=P.filter(function(x){return x.id===id})[0];if(p){tam=null;prod(p)}else lista();scrollTo(0,0)}
db.from("produtos").select("*").eq("ativo",true).order("criado",{ascending:false}).then(function(r){
 if(r.error){app.textContent="Não foi possível carregar o catálogo.";return}
 P=r.data;rota();addEventListener("hashchange",rota);
});
</script></body></html>
