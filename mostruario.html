<meta name="robots" content="noindex"><title>Mostruário</title>

*{box-sizing:border-box}
body{margin:0;background:#f5f5f3;color:#111;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:32px 20px 80px}
h1{margin:0 0 6px;font-size:1.8rem}
p{margin:0 0 14px;color:#555}
.box{background:#fff;border:1px solid #e6e6e3;padding:18px;margin:18px 0}
label{display:block;margin:10px 0 4px;font-size:.8rem;font-weight:600;color:#777}
input{width:100%;padding:10px 12px;border:1px solid #d9d9d5;font:inherit}
button{font:inherit;cursor:pointer;padding:12px 18px;border:1px solid #111;background:#111;color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:18px 0}
.c img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#eee}
.c b{display:block;margin-top:6px;font-size:.85rem}
.c span{color:#777;font-size:.8rem}
#log{white-space:pre-wrap;font:13px/1.6 ui-monospace,monospace;color:#333;margin:14px 0 0}
.err{color:#b3261e}.ok{color:#1b7f3b;font-weight:600}
a{color:inherit}
</style></head><body><main>
<h1>Mostruário</h1>
<p>Esta página apaga os produtos atuais da loja e cadastra 10 produtos de exemplo, cada um com 3 fotos. Serve só para montar o modelo.</p>
<div class="box" id="auth" hidden>
<b>Entre com o mesmo e-mail e senha do painel</b>
<label for="em">E-mail</label><input id="em" type="email"><label for="se">Senha</label><input id="se" type="password">
<p id="aerr" class="err" style="margin:8px 0 0"></p><button id="entrar" style="margin-top:10px">Entrar</button></div>
<div id="app" hidden>
<div class="grid" id="grid"></div>
<button id="go">Apagar os produtos atuais e carregar estes 10</button>
<div id="log"></div></div>
</main>

function art(i,k){var p=PRODS[i];return k===2?wrap(p.d("f"),p.z):wrap(p.d(k===1?"b":"f"))}

var db=null,$=function(i){return document.getElementById(i)};
try{db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
function brl(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function uri(s){return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s)}
function log(t,c){var d=document.createElement("div");if(c)d.className=c;d.textContent=t;$("log").appendChild(d)}
function png(svg){return new Promise(function(ok,no){var im=new Image();im.onload=function(){var c=document.createElement("canvas");c.width=800;c.height=1000;c.getContext("2d").drawImage(im,0,0,800,1000);c.toBlob(function(b){b?ok(b):no(new Error("sem imagem"))},"image/png")};im.onerror=function(){no(new Error("falha ao desenhar"))};im.src=uri(svg)})}
function grade(){$("grid").innerHTML=PRODS.map(function(p,i){return '<div class="c"><img alt="" src="'+uri(art(i,0))+'"><b>'+p.nome+'</b><span>'+brl(p.preco)+' · '+p.cat+'</span></div>'}).join("")}
async function mostra(){
 if(!db){$("auth").hidden=false;$("aerr").textContent="Não consegui carregar o Supabase. Confira se o config.js está na mesma pasta.";return}
 var s=await db.auth.getSession();
 if(s.data&&s.data.session){$("auth").hidden=true;$("app").hidden=false;grade()}else{$("auth").hidden=false;$("app").hidden=true}
}
$("entrar").onclick=async function(){
 var r=await db.auth.signInWithPassword({email:$("em").value.trim(),password:$("se").value});
 if(r.error)$("aerr").textContent="E-mail ou senha incorretos.";else{$("aerr").textContent="";mostra()}
};
$("se").onkeydown=function(e){if(e.key==="Enter")$("entrar").click()};
async function insere(row){
 var r=await db.from("produtos").insert(row).select().single();
 if(r.error&&/fotos/i.test(r.error.message||"")){delete row.fotos;r=await db.from("produtos").insert(row).select().single()}
 if(r.error&&/estoque/i.test(r.error.message||"")){delete row.estoque;r=await db.from("produtos").insert(row).select().single()}
 return r
}
$("go").onclick=async function(){
 if(!confirm("Isso APAGA todos os produtos atuais da loja e cadastra os 10 do mostruário. Continuar?"))return;
 var b=$("go");b.disabled=true;$("log").innerHTML="";
 try{
  log("Apagando os produtos atuais...");
  await db.from("custos").delete().not("produto_id","is",null);
  var d=await db.from("produtos").delete().not("id","is",null);
  if(d.error){log("Erro ao apagar: "+d.error.message+". Saia e entre de novo no painel e tente outra vez.","err");b.disabled=false;return}
  var t=Date.now();
  for(var i=PRODS.length-1;i>=0;i--){
   var p=PRODS[i],urls=[];
   log("Enviando "+p.nome+"...");
   for(var k=0;k<3;k++){
    var blob=await png(art(i,k)),n="mostruario-"+t+"-"+(i+1)+"-"+(k+1)+".png";
    var u=await db.storage.from("fotos").upload(n,blob,{contentType:"image/png"});
    if(u.error){log("Erro ao enviar foto: "+u.error.message,"err");b.disabled=false;return}
    urls.push(db.storage.from("fotos").getPublicUrl(n).data.publicUrl)
   }
   var r=await insere({nome:p.nome,preco:p.preco,categoria:p.cat,variedade:p.vari,tamanhos:p.tams.join(", "),descricao:p.desc,ativo:true,mais_vendido:p.mv,foto_url:urls[0],fotos:urls,estoque:p.est});
   if(r.error){log("Erro ao salvar "+p.nome+": "+r.error.message,"err");b.disabled=false;return}
  }
  log("Pronto! 10 produtos cadastrados.","ok");
  var l=document.createElement("p");l.innerHTML='<a href="/" target="_blank">Abrir a loja</a> · <a href="admin.html" target="_blank">Abrir o painel</a><br>Depois de conferir, apague o arquivo mostruario.html do repositório.';$("log").appendChild(l)
 }catch(e){log("Erro: "+(e&&e.message||e),"err");b.disabled=false}
};
mostra();
</script></body></html>
